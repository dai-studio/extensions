# dai.types.design.breakpoint
name: "Breakpoint"
version: 1.0.0
description: "A responsive breakpoint. Nest it in a component, section or page to describe how that element changes from this width up."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="13" height="10" rx="1" /><path d="M7 18h5" /><rect x="17" y="8" width="4" height="12" rx="1" /></svg>
order: 90
colors:
  fill: '#FFF1F2'
  stroke: '#E11D48'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Breakpoint name"
  - key: tokenName
    label: "Token name"
    type: text
    placeholder: "e.g. --dai-bp-md"
    hint: "CSS custom property or DTCG path."
  - key: minWidth
    label: "Min width"
    type: text
    placeholder: "e.g. 768px"
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "What changes at this breakpoint."
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      @media (min-width: 768px) {
        .dai-page {
          grid-template-columns: 240px 1fr;
        }
      }
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Devices and layouts this targets."
