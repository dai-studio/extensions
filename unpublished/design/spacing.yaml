# dai.types.design.spacing
name: "Spacing"
version: 1.0.0
description: "A spacing token or scale used for padding, margins and gaps. Nest it in a design system for global use or in a component for local overrides."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16" /><path d="M20 4v16" /><path d="M8 12h8" /><path d="M10 10l-2 2l2 2" /><path d="M14 10l2 2l-2 2" /></svg>
order: 50
colors:
  fill: '#FFF1F2'
  stroke: '#E11D48'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Spacing name"
  - key: tokenName
    label: "Token name"
    type: text
    placeholder: "e.g. --dai-space-4"
    hint: "CSS custom property or DTCG path."
  - key: value
    label: "Value"
    type: text
    placeholder: "e.g. 1rem"
  - key: scale
    label: "Scale"
    type: text
    placeholder: "e.g. 4px base, steps 1 2 3 4 6 8"
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "Where this spacing applies, e.g. \"gap between form fields\"."
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      :root {
        --dai-space-1: 0.25rem;
        --dai-space-2: 0.5rem;
        --dai-space-3: 0.75rem;
        --dai-space-4: 1rem;
        --dai-space-6: 1.5rem;
        --dai-space-8: 2rem;
      }
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Density modes and exceptions."
