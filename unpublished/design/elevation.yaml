# dai.types.design.elevation
name: "Elevation"
version: 1.0.0
description: "A shadow or elevation level that expresses depth and layering. Nest it in a design system or theme; dark themes usually need their own values."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="13" height="13" rx="2" /><path d="M20 8v10a2 2 0 0 1 -2 2h-10" /></svg>
order: 70
colors:
  fill: '#FFF1F2'
  stroke: '#E11D48'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Elevation name"
  - key: tokenName
    label: "Token name"
    type: text
    placeholder: "e.g. --dai-shadow-md"
    hint: "CSS custom property or DTCG path."
  - key: value
    label: "Value"
    type: text
    placeholder: "e.g. 0 4px 12px rgb(0 0 0 / 0.12)"
  - key: level
    label: "Level"
    type: select
    defaultValue: "raised"
    options:
      - value: "flat"
        label: "Flat"
      - value: "raised"
        label: "Raised"
      - value: "overlay"
        label: "Overlay"
      - value: "modal"
        label: "Modal"
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "Which components sit at this level."
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      :root {
        --dai-shadow-sm: 0 1px 2px rgb(15 23 42 / 0.08);
        --dai-shadow-md: 0 4px 12px rgb(15 23 42 / 0.12);
        --dai-shadow-lg: 0 12px 32px rgb(15 23 42 / 0.18);
      }
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Z-index pairing and dark-mode behaviour."
