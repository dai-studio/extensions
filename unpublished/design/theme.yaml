# dai.types.design.theme
name: "Theme"
version: 1.0.0
description: "A set of token values for one mode or brand, e.g. light, dark or high contrast. Nest colour and other tokens inside it to give them theme-specific values. Nest it anywhere: an element applies within its parent."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0 -18" /><path d="M12 3v18" /><path d="M12 9l4.65 -4.65" /><path d="M12 14.3l7.37 -7.37" /><path d="M12 19.6l8.85 -8.85" /></svg>
order: 20
colors:
  fill: '#FFF1F2'
  stroke: '#E11D48'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Theme name"
  - key: mode
    label: "Mode"
    type: select
    defaultValue: "light"
    options:
      - value: "light"
        label: "Light"
      - value: "dark"
        label: "Dark"
      - value: "high-contrast"
        label: "High contrast"
      - value: "brand"
        label: "Brand"
  - key: selector
    label: "Selector"
    type: text
    placeholder: "e.g. [data-theme=\"dark\"]"
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      [data-theme="dark"] {
        --dai-color-primary: #60a5fa;
        --dai-color-primary-contrast: #0f172a;
        --dai-color-surface: #0f172a;
        --dai-color-surface-alt: #1e293b;
        --dai-color-text: #f1f5f9;
        --dai-color-text-muted: #94a3b8;
        --dai-color-border: #334155;
      }
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "When this theme applies and how users switch to it."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Contrast checks, open issues and differences from the default theme."
