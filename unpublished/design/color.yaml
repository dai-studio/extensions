# dai.types.design.color
name: "Color"
version: 1.0.0
description: "A colour token: a primitive (blue-600) or a semantic role (primary, surface, danger). Nested in a theme it is that theme's value; nested in a component it is scoped to that component."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 0 1 0 -18c4.97 0 9 3.582 9 8c0 1.06 -.474 2.078 -1.318 2.828c-.844 .75 -1.989 1.172 -3.182 1.172h-2.5a2 2 0 0 0 -1 3.75a1.3 1.3 0 0 1 -1 2.25" /><path d="M7.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M11.5 7.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M15.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /></svg>
order: 30
colors:
  fill: '#FFF1F2'
  stroke: '#E11D48'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Color name"
  - key: tokenName
    label: "Token name"
    type: text
    placeholder: "e.g. --dai-color-primary"
    hint: "CSS custom property or DTCG path."
  - key: value
    label: "Value"
    type: text
    placeholder: "e.g. #2563eb or oklch(55% 0.2 260)"
  - key: role
    label: "Role"
    type: select
    defaultValue: "brand"
    options:
      - value: "brand"
        label: "Brand"
      - value: "surface"
        label: "Surface"
      - value: "text"
        label: "Text"
      - value: "border"
        label: "Border"
      - value: "feedback"
        label: "Feedback"
      - value: "primitive"
        label: "Primitive"
  - key: contrastOn
    label: "Contrast"
    type: text
    placeholder: "e.g. 4.8:1 on surface (AA)"
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "Where to use it, and where not to."
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      :root {
        --dai-color-primary: #2563eb;
        --dai-color-primary-contrast: #ffffff;
      }

      .swatch {
        display: inline-grid;
        place-items: center;
        width: 8rem;
        height: 4rem;
        border-radius: 8px;
        font: 600 0.875rem system-ui, sans-serif;
        background: var(--dai-color-primary);
        color: var(--dai-color-primary-contrast);
      }
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Accessibility notes and related colours."
