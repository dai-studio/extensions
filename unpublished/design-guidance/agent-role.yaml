# dai.types.design-guidance.agent-role
name: "Agent Role"
version: 1.0.0
description: "A role an AI agent plays in design work, e.g. visual critic, copy editor or accessibility auditor. Nest rules, rubrics and briefs inside it as its operating guidance; nest it in an AI Agent to give that agent the role."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="14" height="10" rx="2" /><path d="M12 4v4" /><circle cx="9.5" cy="13" r="1" /><circle cx="14.5" cy="13" r="1" /><path d="M3 12v2" /><path d="M21 12v2" /></svg>
order: 70
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Role name"
  - key: instruction
    label: "Instruction"
    type: markdown
    placeholder: "What this role does, how it works and how it reports back."
  - key: responsibilities
    label: "Responsibilities"
    type: list
    placeholder: "e.g. Flag contrast failures"
  - key: inputs
    label: "Inputs"
    type: list
    placeholder: "e.g. Screens, design system"
  - key: outputs
    label: "Outputs"
    type: list
    placeholder: "e.g. Prioritised findings with fixes"
  - key: voice
    label: "Voice"
    type: text
    placeholder: "e.g. Direct, specific, kind"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Limits, escalation and examples of good output."
