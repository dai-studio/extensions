# dai.types.design-guidance.design-brief
name: "Design Brief"
version: 1.0.0
description: "The brief for a piece of design work: problem, audience, goals, constraints and what done looks like. Agents read it before designing anything nested inside it."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-12a2 2 0 0 0 -2 -2h-2" /><rect x="9" y="3" width="6" height="4" rx="2" /><path d="M9 12h6" /><path d="M9 16h4" /></svg>
order: 10
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Brief name"
  - key: instruction
    label: "Instruction"
    type: markdown
    placeholder: "The problem to solve and what to produce."
  - key: audience
    label: "Audience"
    type: text
    placeholder: "Who this is for"
  - key: objectives
    label: "Objectives"
    type: list
    placeholder: "e.g. Cut sign-up time in half"
  - key: constraints
    label: "Constraints"
    type: list
    placeholder: "e.g. Must work on mobile web"
  - key: deliverables
    label: "Deliverables"
    type: list
    placeholder: "e.g. Hi-fi screens for the sign-up flow"
  - key: rationale
    label: "Rationale"
    type: textarea
    placeholder: "Why this matters. Helps agents apply it to cases it does not spell out."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Stakeholders, deadlines and references."
