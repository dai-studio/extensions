# dai.types.design-guidance.accessibility-rule
name: "Accessibility Rule"
version: 1.0.0
description: "An accessibility requirement, usually tied to a WCAG success criterion. It applies to whatever it is nested in (at the root: the whole document)."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M10 16.5l2 -3l2 3m-2 -3v-2l3 -1m-6 0l3 1" /><circle cx="12" cy="7.5" r=".5" fill="currentColor" /></svg>
order: 40
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Accessibility rule name"
  - key: instruction
    label: "Instruction"
    type: markdown
    placeholder: "The requirement and how to meet it, e.g. \"Text must have 4.5:1 contrast against its background.\""
  - key: priority
    label: "Priority"
    type: select
    defaultValue: "should"
    hint: "RFC 2119 strength. Agents treat \"must\" as non-negotiable."
    options:
      - value: "must"
        label: "Must"
      - value: "should"
        label: "Should"
      - value: "may"
        label: "May"
  - key: wcag
    label: "WCAG criterion"
    type: text
    placeholder: "e.g. 1.4.3 Contrast (Minimum)"
  - key: level
    label: "Level"
    type: select
    defaultValue: "AA"
    options:
      - value: "A"
        label: "A"
      - value: "AA"
        label: "AA"
      - value: "AAA"
        label: "AAA"
  - key: rationale
    label: "Rationale"
    type: textarea
    placeholder: "Why this matters. Helps agents apply it to cases it does not spell out."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Sources, owners and history."
