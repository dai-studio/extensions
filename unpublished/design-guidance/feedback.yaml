# dai.types.design-guidance.feedback
name: "Feedback"
version: 1.0.0
description: "A piece of design feedback on whatever it is nested in, from a person or an agent, with its resolution."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" /><path d="M8 11h.01" /><path d="M12 11h.01" /><path d="M16 11h.01" /></svg>
order: 80
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Feedback name"
  - key: instruction
    label: "Instruction"
    type: markdown
    placeholder: "The observation and the suggested change."
  - key: priority
    label: "Priority"
    type: select
    defaultValue: "should"
    hint: "RFC 2119 strength. Agents treat \"must\" as non-negotiable."
    options:
      - value: "must"
        label: "Must"
      - value: "should"
        label: "Should"
      - value: "may"
        label: "May"
  - key: author
    label: "Author"
    type: text
    placeholder: "Person or agent"
  - key: resolution
    label: "Resolution"
    type: select
    defaultValue: "open"
    options:
      - value: "open"
        label: "Open"
      - value: "accepted"
        label: "Accepted"
      - value: "rejected"
        label: "Rejected"
      - value: "done"
        label: "Done"
  - key: rationale
    label: "Rationale"
    type: textarea
    placeholder: "Why this matters. Helps agents apply it to cases it does not spell out."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Discussion and follow-ups."
