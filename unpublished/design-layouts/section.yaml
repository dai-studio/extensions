# dai.types.design-layouts.section
name: "Section"
version: 1.0.0
description: "A region of a page, e.g. hero, features, pricing or footer. Nest the components it contains inside it."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1" /><rect x="3" y="14" width="18" height="6" rx="1" /></svg>
order: 20
colors:
  fill: '#ECFEFF'
  stroke: '#0891B2'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Section name"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <section class="dai-section" aria-labelledby="features-title">
        <h2 class="dai-section__title" id="features-title">Everything you need</h2>
        <p class="dai-section__lead">Plan, design and ship from one shared model.</p>
        <div class="dai-section__grid">
          <div class="dai-section__item">Plan</div>
          <div class="dai-section__item">Design</div>
          <div class="dai-section__item">Ship</div>
        </div>
      </section>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-section {
        padding: var(--dai-space-8, 2rem) var(--dai-space-6, 1.5rem);
        font-family: var(--dai-font-sans, system-ui, sans-serif);
        text-align: center;
      }

      .dai-section__title { margin: 0; font-size: var(--dai-text-xl, 1.75rem); }
      .dai-section__lead { color: var(--dai-color-text-muted, #475569); }

      .dai-section__grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(10rem, 1fr));
        gap: var(--dai-space-4, 1rem);
        margin-top: var(--dai-space-6, 1.5rem);
      }

      .dai-section__item {
        padding: var(--dai-space-6, 1.5rem);
        border-radius: var(--dai-radius-md, 8px);
        background: var(--dai-color-surface-alt, #f8fafc);
      }
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "What this is for and the content it holds."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions and links."
