# dai.types.design-layouts.page
name: "Page"
version: 1.0.0
description: "A page template: the regions of a page and how they reflow. Nest sections, components and breakpoints inside it."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2z" /></svg>
order: 10
colors:
  fill: '#ECFEFF'
  stroke: '#0891B2'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Page name"
  - key: route
    label: "Route"
    type: text
    placeholder: "e.g. /dashboard"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <div class="dai-page">
        <header class="dai-page__header">Header</header>
        <aside class="dai-page__sidebar">Sidebar</aside>
        <main class="dai-page__main">Main content</main>
        <footer class="dai-page__footer">Footer</footer>
      </div>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-page {
        display: grid;
        min-height: 100vh;
        grid-template-areas: "header" "main" "footer";
        grid-template-rows: auto 1fr auto;
        font-family: var(--dai-font-sans, system-ui, sans-serif);
      }

      @media (min-width: 768px) {
        .dai-page {
          grid-template-areas: "header header" "sidebar main" "footer footer";
          grid-template-columns: 240px 1fr;
        }
      }

      .dai-page > * { padding: var(--dai-space-4, 1rem); border: 1px dashed var(--dai-color-border, #e2e8f0); }
      .dai-page__header { grid-area: header; }
      .dai-page__sidebar { grid-area: sidebar; display: none; }
      .dai-page__main { grid-area: main; }
      .dai-page__footer { grid-area: footer; }

      @media (min-width: 768px) {
        .dai-page__sidebar { display: block; }
      }
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "What this is for and the content it holds."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions and links."
