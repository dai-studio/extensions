# dai.types.design-layouts.screen
name: "Screen"
version: 1.0.0
description: "A concrete screen or view in a product. Nest components and states (empty, loading, error) inside it; connect screens with sequence flows to show navigation."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="1" /><path d="M7 20h10" /><path d="M9 16v4" /><path d="M15 16v4" /></svg>
order: 30
colors:
  fill: '#ECFEFF'
  stroke: '#0891B2'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Screen name"
  - key: route
    label: "Route"
    type: text
    placeholder: "e.g. /projects"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <div class="dai-screen">
        <header class="dai-screen__bar">
          <h1 class="dai-screen__title">Projects</h1>
          <button class="dai-screen__cta" type="button">New project</button>
        </header>
        <ul class="dai-screen__list">
          <li>Website redesign</li>
          <li>Mobile onboarding</li>
          <li>Billing migration</li>
        </ul>
      </div>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-screen {
        max-width: 40rem;
        margin: 0 auto;
        padding: var(--dai-space-6, 1.5rem);
        font-family: var(--dai-font-sans, system-ui, sans-serif);
        color: var(--dai-color-text, #0f172a);
      }

      .dai-screen__bar { display: flex; align-items: center; justify-content: space-between; }
      .dai-screen__title { margin: 0; font-size: var(--dai-text-xl, 1.75rem); }

      .dai-screen__cta {
        font: inherit;
        padding: var(--dai-space-2, 0.5rem) var(--dai-space-4, 1rem);
        border: 0;
        border-radius: var(--dai-radius-md, 8px);
        background: var(--dai-color-primary, #2563eb);
        color: var(--dai-color-primary-contrast, #ffffff);
      }

      .dai-screen__list { margin: var(--dai-space-6, 1.5rem) 0 0; padding: 0; list-style: none; }

      .dai-screen__list li {
        padding: var(--dai-space-3, 0.75rem) 0;
        border-bottom: 1px solid var(--dai-color-border, #e2e8f0);
      }
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "What this is for and the content it holds."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions and links."
