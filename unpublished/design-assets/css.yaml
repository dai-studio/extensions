# dai.types.design-assets.css
name: "CSS"
version: 1.0.0
description: "A reusable CSS snippet: utilities, keyframes or resets. Nested in a component it applies to that component."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h-1a2 2 0 0 0 -2 2v4l-2 2l2 2v4a2 2 0 0 0 2 2h1" /><path d="M16 4h1a2 2 0 0 1 2 2v4l2 2l-2 2v4a2 2 0 0 1 -2 2h-1" /></svg>
order: 30
colors:
  fill: '#F0FDF4'
  stroke: '#16A34A'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Snippet name"
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .visually-hidden {
        position: absolute !important;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .truncate {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "What it is for and how to adapt it."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Browser support and caveats."
