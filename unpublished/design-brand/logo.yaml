# dai.types.design-brand.logo
name: "Logo"
version: 1.0.0
description: "A logo or brand mark, with clear-space and minimum-size rules. Nest variants (mono, reversed, icon-only) inside it."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M8 15l4 -7l4 7z" /></svg>
order: 20
colors:
  fill: '#FFFBEB'
  stroke: '#D97706'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Logo name"
  - key: svg
    label: "SVG"
    type: svg
    rows: 10
    example: |-
      <svg xmlns="http://www.w3.org/2000/svg" width="160" height="40" viewBox="0 0 160 40" role="img" aria-label="Acme">
        <title>Acme</title>
        <rect x="2" y="2" width="36" height="36" rx="10" fill="#2563eb" />
        <path d="M12 28l8 -16l8 16" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
        <text x="48" y="27" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#0f172a">Acme</text>
      </svg>
  - key: clearSpace
    label: "Clear space"
    type: text
    placeholder: "e.g. Height of the mark on all sides"
  - key: minSize
    label: "Minimum size"
    type: text
    placeholder: "e.g. 24px tall on screen"
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "Approved backgrounds, misuse examples and placement."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Source files and licensing."
