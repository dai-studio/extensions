# dai.types.design-brand.tone
name: "Tone"
version: 1.0.0
description: "A context-specific shift of the voice, e.g. errors, onboarding or celebrations. Nest it in a voice, or in a component or screen to set the tone there."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h2l3 -7l4 14l3 -7h6" /></svg>
order: 40
colors:
  fill: '#FFFBEB'
  stroke: '#D97706'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Tone name"
  - key: context
    label: "Context"
    type: text
    placeholder: "e.g. Error messages"
  - key: instruction
    label: "Instruction"
    type: markdown
    placeholder: "How the voice changes in this context."
  - key: sample
    label: "Sample"
    type: textarea
    placeholder: "e.g. \"We couldn't save that. Check your connection and try again.\""
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Edge cases and examples to avoid."
