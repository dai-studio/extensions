# dai.types.design-brand.brand
name: "Brand"
version: 1.0.0
description: "A brand identity. Nest its logo, voice, tones and brand colours inside it. Agents should read it before writing copy or choosing visuals."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17.75l-6.172 3.245l1.179 -6.873l-5 -4.867l6.9 -1l3.086 -6.253l3.086 6.253l6.9 1l-5 4.867l1.179 6.873z" /></svg>
order: 10
colors:
  fill: '#FFFBEB'
  stroke: '#D97706'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Brand name"
  - key: mission
    label: "Mission"
    type: textarea
    placeholder: "What the brand exists to do, in one or two sentences."
  - key: personality
    label: "Personality"
    type: list
    placeholder: "e.g. Confident"
  - key: audience
    label: "Audience"
    type: text
    placeholder: "Who the brand speaks to"
  - key: css
    label: "Brand CSS"
    type: css
    rows: 10
    example: |-
      :root {
        --dai-brand-primary: #2563eb;
        --dai-brand-accent: #f59e0b;
        --dai-brand-ink: #0f172a;
      }
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Brand history, owners and references."
