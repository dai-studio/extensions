# dai.types.design-brand.voice
name: "Voice"
version: 1.0.0
description: "How the brand sounds everywhere: the constant personality behind all copy. Nest tones inside it for specific contexts. Agents follow it when writing UI text."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9h8" /><path d="M8 13h6" /><path d="M18 4a3 3 0 0 1 3 3v8a3 3 0 0 1 -3 3h-5l-5 3v-3h-2a3 3 0 0 1 -3 -3v-8a3 3 0 0 1 3 -3h12z" /></svg>
order: 30
colors:
  fill: '#FFFBEB'
  stroke: '#D97706'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Voice name"
  - key: traits
    label: "Traits"
    type: list
    placeholder: "e.g. Plain-spoken, not casual"
  - key: instruction
    label: "Instruction"
    type: markdown
    placeholder: "How to write in this voice. Use imperative sentences an agent can follow."
  - key: sample
    label: "Sample"
    type: textarea
    placeholder: "A short passage written in this voice."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Words to prefer and avoid."
