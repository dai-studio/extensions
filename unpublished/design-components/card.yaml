# dai.types.design-components.card
name: "Card"
version: 1.0.0
description: "A contained surface grouping related content and actions. Nest the components it contains (media, buttons, badges) inside it as its parts."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M3 10h18" /><path d="M7 14h6" /></svg>
order: 60
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Card name"
  - key: status
    label: "Status"
    type: select
    defaultValue: "draft"
    options:
      - value: "draft"
        label: "Draft"
      - value: "beta"
        label: "Beta"
      - value: "stable"
        label: "Stable"
      - value: "deprecated"
        label: "Deprecated"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <article class="dai-card">
        <header class="dai-card__header">
          <h3 class="dai-card__title">Weekly report</h3>
          <p class="dai-card__meta">Updated 2 hours ago</p>
        </header>
        <p class="dai-card__body">Revenue is up 12% week over week, driven by the new onboarding flow.</p>
        <footer class="dai-card__actions">
          <button class="dai-button" type="button">Open</button>
        </footer>
      </article>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-card {
        display: grid;
        gap: var(--dai-space-3, 0.75rem);
        max-width: 22rem;
        padding: var(--dai-space-6, 1.5rem);
        border: 1px solid var(--dai-color-border, #e2e8f0);
        border-radius: var(--dai-radius-lg, 16px);
        background: var(--dai-color-surface, #ffffff);
        box-shadow: var(--dai-shadow-sm, 0 1px 2px rgb(15 23 42 / 0.08));
        font-family: var(--dai-font-sans, system-ui, sans-serif);
        color: var(--dai-color-text, #0f172a);
      }

      .dai-card__title { margin: 0; font-size: var(--dai-text-lg, 1.25rem); }
      .dai-card__meta { margin: 0; font-size: var(--dai-text-sm, 0.875rem); color: var(--dai-color-text-muted, #475569); }
      .dai-card__body { margin: 0; }
      .dai-card__actions { display: flex; gap: var(--dai-space-2, 0.5rem); justify-content: flex-end; }

      .dai-button {
        font: inherit;
        padding: var(--dai-space-2, 0.5rem) var(--dai-space-4, 1rem);
        border: 0;
        border-radius: var(--dai-radius-md, 8px);
        background: var(--dai-color-primary, #2563eb);
        color: var(--dai-color-primary-contrast, #ffffff);
      }
  - key: accessibility
    label: "Accessibility"
    type: markdown
    placeholder: "Role, keyboard behaviour, ARIA attributes, focus handling and contrast requirements."
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "When to use it, when not to, and do/don't guidance."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions, links to code and design files."
