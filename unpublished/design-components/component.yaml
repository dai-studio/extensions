# dai.types.design-components.component
name: "Component"
version: 1.0.0
description: "A generic UI component specification: markup, styles, accessibility and usage. Its children are its parts; nest variants and states inside it to modify it. Nested under a design system it is a definition; nested elsewhere it is a usage of the definition with the same name. For the code unit, use software Component."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9l-8 4.5l-8 -4.5v-9l8 -4.5" /><path d="M12 12l8 -4.5" /><path d="M12 12v9" /><path d="M12 12l-8 -4.5" /></svg>
order: 10
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Component name"
  - key: status
    label: "Status"
    type: select
    defaultValue: "draft"
    options:
      - value: "draft"
        label: "Draft"
      - value: "beta"
        label: "Beta"
      - value: "stable"
        label: "Stable"
      - value: "deprecated"
        label: "Deprecated"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <div class="dai-component">
        <span class="dai-component__label">Component</span>
      </div>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-component {
        display: inline-flex;
        align-items: center;
        gap: var(--dai-space-2, 0.5rem);
        padding: var(--dai-space-2, 0.5rem) var(--dai-space-3, 0.75rem);
        border: 1px solid var(--dai-color-border, #e2e8f0);
        border-radius: var(--dai-radius-md, 8px);
        font-family: var(--dai-font-sans, system-ui, sans-serif);
      }
  - key: accessibility
    label: "Accessibility"
    type: markdown
    placeholder: "Role, keyboard behaviour, ARIA attributes, focus handling and contrast requirements."
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "When to use it, when not to, and do/don't guidance."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions, links to code and design files."
