# dai.types.design-components.state
name: "State"
version: 1.0.0
description: "A state of its parent: interaction (hover, focus, disabled), or data (loading, empty, error, success). Nest it inside the component or screen it applies to."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="2" /><rect x="2" y="6" width="20" height="12" rx="6" /></svg>
order: 30
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "State name"
  - key: kind
    label: "Kind"
    type: select
    defaultValue: "loading"
    options:
      - value: "hover"
        label: "Hover"
      - value: "focus"
        label: "Focus"
      - value: "active"
        label: "Active"
      - value: "disabled"
        label: "Disabled"
      - value: "selected"
        label: "Selected"
      - value: "loading"
        label: "Loading"
      - value: "empty"
        label: "Empty"
      - value: "error"
        label: "Error"
      - value: "success"
        label: "Success"
  - key: trigger
    label: "Trigger"
    type: text
    placeholder: "What puts the element in this state"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <button class="dai-button" type="button" aria-busy="true" disabled>
        <span class="dai-spinner" aria-hidden="true"></span>
        Saving…
      </button>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-button[aria-busy="true"] {
        display: inline-flex;
        align-items: center;
        gap: var(--dai-space-2, 0.5rem);
        font: 500 1rem / 1.25 var(--dai-font-sans, system-ui, sans-serif);
        padding: var(--dai-space-2, 0.5rem) var(--dai-space-4, 1rem);
        border: 0;
        border-radius: var(--dai-radius-md, 8px);
        background: var(--dai-color-primary, #2563eb);
        color: var(--dai-color-primary-contrast, #ffffff);
        cursor: progress;
        opacity: 0.8;
      }

      .dai-spinner {
        width: 1em;
        height: 1em;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        animation: dai-spin 0.8s linear infinite;
      }

      @keyframes dai-spin { to { transform: rotate(360deg); } }
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "What the user sees and can do in this state."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Copy, timing and recovery."
