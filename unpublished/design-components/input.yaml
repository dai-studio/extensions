# dai.types.design-components.input
name: "Input"
version: 1.0.0
description: "A form control with its label and hint: text field, select, checkbox, switch and similar. Nest states (error, disabled) inside it."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2" /><path d="M7 10v4" /></svg>
order: 50
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Input name"
  - key: status
    label: "Status"
    type: select
    defaultValue: "draft"
    options:
      - value: "draft"
        label: "Draft"
      - value: "beta"
        label: "Beta"
      - value: "stable"
        label: "Stable"
      - value: "deprecated"
        label: "Deprecated"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <div class="dai-field">
        <label class="dai-field__label" for="email">Email</label>
        <input class="dai-input" id="email" type="email" placeholder="you@example.com" aria-describedby="email-hint" />
        <p class="dai-field__hint" id="email-hint">We never share your email.</p>
      </div>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-field {
        display: grid;
        gap: var(--dai-space-1, 0.25rem);
        font-family: var(--dai-font-sans, system-ui, sans-serif);
        max-width: 20rem;
      }

      .dai-field__label { font-weight: 600; font-size: var(--dai-text-sm, 0.875rem); }

      .dai-input {
        font: inherit;
        padding: var(--dai-space-2, 0.5rem) var(--dai-space-3, 0.75rem);
        border: 1px solid var(--dai-color-border, #e2e8f0);
        border-radius: var(--dai-radius-md, 8px);
        background: var(--dai-color-surface, #ffffff);
        color: var(--dai-color-text, #0f172a);
      }

      .dai-input:focus-visible {
        outline: 2px solid var(--dai-color-primary, #2563eb);
        outline-offset: 1px;
      }

      .dai-input[aria-invalid="true"] { border-color: var(--dai-color-danger, #dc2626); }

      .dai-field__hint { margin: 0; font-size: var(--dai-text-sm, 0.875rem); color: var(--dai-color-text-muted, #475569); }
  - key: accessibility
    label: "Accessibility"
    type: markdown
    placeholder: "Role, keyboard behaviour, ARIA attributes, focus handling and contrast requirements."
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "When to use it, when not to, and do/don't guidance."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions, links to code and design files."
