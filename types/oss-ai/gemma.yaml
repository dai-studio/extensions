# dai.types.oss-ai.gemma
name: "Gemma"
version: 1.0.0
description: "Google's Gemma family of open-weight models. Connect it to the inference server that serves it. License: Gemma Terms of Use (source-available)."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8" /><path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8" /><path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5" /><path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0" /><path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5" /><path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10" /></svg>
order: 280
group: models
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Gemma name"
  - key: variant
    label: "Variant"
    type: text
    placeholder: "e.g. Gemma 3 27B"
  - key: parameters
    label: "Parameters"
    type: text
    placeholder: "e.g. 8B, or 120B total / 5B active"
  - key: quantization
    label: "Quantization"
    type: text
    placeholder: "e.g. BF16, FP8, Q4_K_M"
  - key: contextWindow
    label: "Context window (tokens)"
    type: number
    min: 0
  - key: servedBy
    label: "Served by"
    type: text
    placeholder: "e.g. vLLM, Ollama, llama.cpp"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "License terms, hardware needs, prompt format and evaluation notes."
