# dai.types.cloud.web-app
name: "Web App"
version: 1.0.0
description: "A managed web application platform, such as Azure App Service, AWS Elastic Beanstalk, App Engine or Heroku."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -10" /><path d="M6 8h.01" /><path d="M9 8h.01" /><path d="M3 11h18" /></svg>
order: 130
colors:
  fill: '#F1F5F9'
  stroke: '#475569'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Web App name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: runtime
    label: "Runtime"
    type: text
    placeholder: "e.g. node 22, python 3.13, .NET 8"
  - key: framework
    label: "Framework"
    type: text
    placeholder: "e.g. Next.js, Django, Rails"
  - key: url
    label: "URL"
    type: text
    placeholder: "https://…"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What the app serves and how it is deployed."
