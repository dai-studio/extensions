# dai.types.cloud.aws-api-gateway
name: Amazon API Gateway
version: 1.0.0
description: "An API Gateway REST, HTTP or WebSocket API."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h5" /><path d="M12 16v-8h3a2 2 0 0 1 2 2v1a2 2 0 0 1 -2 2h-3" /><path d="M20 8v8" /><path d="M9 16v-5.5a2.5 2.5 0 0 0 -5 0v5.5" /></svg>
order: 280
colors:
  fill: '#F7F3FF'
  stroke: '#8C4FFF'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: API Gateway name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: apiType
    label: API type
    type: select
    options:
      - value: rest
        label: REST
      - value: http
        label: HTTP
      - value: websocket
        label: WebSocket
  - key: endpointType
    label: Endpoint type
    type: select
    defaultValue: regional
    options:
      - value: edge
        label: Edge-optimised
      - value: regional
        label: Regional
      - value: private
        label: Private
  - key: stage
    label: Stage
    type: text
    placeholder: prod
  - key: authType
    label: Authorisation
    type: select
    options:
      - value: none
        label: None
      - value: iam
        label: IAM
      - value: cognito
        label: Cognito
      - value: lambda
        label: Lambda authoriser
      - value: jwt
        label: JWT
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the routes and integrations.
