# dai.types.cloud.aws-kms-key
name: AWS KMS Key
version: 1.0.0
description: An AWS KMS key for encryption or signing.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16.555 3.843l3.602 3.602a2.877 2.877 0 0 1 0 4.069l-2.643 2.643a2.877 2.877 0 0 1 -4.069 0l-.301 -.301l-6.558 6.558a2 2 0 0 1 -1.239 .578l-.175 .008h-1.172a1 1 0 0 1 -.993 -.883l-.007 -.117v-1.172a2 2 0 0 1 .467 -1.284l.119 -.13l.414 -.414h2v-2h2v-2l2.144 -2.144l-.301 -.301a2.877 2.877 0 0 1 0 -4.069l2.643 -2.643a2.877 2.877 0 0 1 4.069 0" /><path d="M15 9h.01" /></svg>
order: 610
colors:
  fill: '#FDF1F2'
  stroke: '#DD344C'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: KMS Key name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: keyAlias
    label: Alias
    type: text
    placeholder: alias/app-data
  - key: keySpec
    label: Key spec
    type: select
    defaultValue: symmetric
    options:
      - value: symmetric
        label: Symmetric (AES-256)
      - value: rsa
        label: Asymmetric RSA
      - value: ecc
        label: Asymmetric ECC
      - value: hmac
        label: HMAC
  - key: rotation
    label: Automatic rotation
    type: boolean
    defaultValue: true
  - key: multiRegion
    label: Multi-Region
    type: boolean
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what the key protects and its key policy.
