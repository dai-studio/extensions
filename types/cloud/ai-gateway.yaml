# dai.types.cloud.ai-gateway
name: "AI Gateway"
version: 1.0.0
description: "A proxy in front of AI model providers that adds caching, rate limiting, fallbacks and logging."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h5" /><path d="M12 16v-8h3a2 2 0 0 1 2 2v1a2 2 0 0 1 -2 2h-3" /><path d="M20 8v8" /><path d="M9 16v-5.5a2.5 2.5 0 0 0 -5 0v5.5" /></svg>
order: 810
colors:
  fill: '#F1F5F9'
  stroke: '#475569'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "AI Gateway name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: providers
    label: "Providers"
    type: list
    placeholder: "e.g. OpenAI, Anthropic, Workers AI"
  - key: caching
    label: "Response caching"
    type: boolean
  - key: rateLimit
    label: "Rate limit"
    type: text
    placeholder: "e.g. 60 req/min per user"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Routing, fallback order and what is logged."
