# dai.types.cloud.encryption-key
name: "Encryption Key"
version: 1.0.0
description: "A key in a key management service, used to encrypt data at rest or sign data."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -6" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" /><path d="M15 16h.01" /><path d="M12.01 16h.01" /><path d="M9.02 16h.01" /></svg>
order: 620
colors:
  fill: '#F1F5F9'
  stroke: '#475569'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Encryption Key name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: algorithm
    label: "Algorithm"
    type: text
    placeholder: "e.g. AES-256, RSA-2048, ECDSA P-256"
  - key: managedBy
    label: "Managed by"
    type: select
    defaultValue: "customer"
    options:
      - value: "provider"
        label: "Provider-managed"
      - value: "customer"
        label: "Customer-managed"
      - value: "external"
        label: "External / HSM"
  - key: rotationDays
    label: "Rotation (days)"
    type: number
    defaultValue: 365
    min: 0
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What the key protects and who can use it."
