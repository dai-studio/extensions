# dai.types.cloud.scheduler
name: "Scheduler"
version: 1.0.0
description: "Triggers a target on a schedule, such as EventBridge Scheduler, Cloud Scheduler or a cron trigger."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M12 10l0 3l2 0" /><path d="M7 4l-2.75 2" /><path d="M17 4l2.75 2" /></svg>
order: 540
colors:
  fill: '#FDF2F8'
  stroke: '#DB2777'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Scheduler name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: schedule
    label: "Schedule"
    type: text
    placeholder: "0 * * * *"
  - key: target
    label: "Target"
    type: text
    placeholder: "What it triggers"
  - key: timezone
    label: "Time zone"
    type: text
    placeholder: "UTC"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What runs on this schedule and what happens if a run is missed."
