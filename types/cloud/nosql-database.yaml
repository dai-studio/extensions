# dai.types.cloud.nosql-database
name: "NoSQL Database"
version: 1.0.0
description: "A non-relational database, such as DynamoDB, Cosmos DB, Firestore or MongoDB."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" /><path d="M3 10h18" /><path d="M10 3v18" /></svg>
order: 410
colors:
  fill: '#F1F5F9'
  stroke: '#475569'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "NoSQL Database name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: dataModel
    label: "Data model"
    type: select
    defaultValue: "document"
    options:
      - value: "document"
        label: "Document"
      - value: "key-value"
        label: "Key-value"
      - value: "wide-column"
        label: "Wide-column"
      - value: "graph"
        label: "Graph"
      - value: "time-series"
        label: "Time-series"
  - key: partitionKey
    label: "Partition key"
    type: text
    placeholder: "e.g. tenantId"
  - key: capacityMode
    label: "Capacity"
    type: select
    defaultValue: "on-demand"
    options:
      - value: "on-demand"
        label: "On demand / serverless"
      - value: "provisioned"
        label: "Provisioned"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Access patterns, indexes and consistency requirements."
