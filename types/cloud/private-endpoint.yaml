# dai.types.cloud.private-endpoint
name: "Private Endpoint"
version: 1.0.0
description: "A private IP inside a Virtual Network that reaches a managed service without crossing the internet, such as a VPC endpoint, Private Link or Private Service Connect. Put it in a Subnet."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1 -5 -5l1.5 -1.5" /><path d="M17 12l-5 -5l1.5 -1.5a3.536 3.536 0 1 1 5 5l-1.5 1.5" /><path d="M3 21l2.5 -2.5" /><path d="M18.5 5.5l2.5 -2.5" /><path d="M10 11l-2 2" /><path d="M13 14l-2 2" /></svg>
order: 240
colors:
  fill: '#F0FDF4'
  stroke: '#16A34A'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Private Endpoint name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: targetService
    label: "Target service"
    type: text
    placeholder: "e.g. object storage, database"
  - key: privateIp
    label: "Private IP"
    type: text
    placeholder: "10.0.1.25"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Which service this endpoint reaches and who uses it."
