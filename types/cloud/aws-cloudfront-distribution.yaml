# dai.types.cloud.aws-cloudfront-distribution
name: Amazon CloudFront Distribution
version: 1.0.0
description: A CloudFront content delivery network (CDN) distribution.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h7" /><path d="M14 20h7" /><path d="M10 20a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M12 16v2" /><path d="M8 16.004h-1.343c-2.572 -.004 -4.657 -2.011 -4.657 -4.487c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-2.535" /></svg>
order: 260
colors:
  fill: '#F7F3FF'
  stroke: '#8C4FFF'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: CloudFront Distribution name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: distributionId
    label: Distribution ID
    type: text
    placeholder: E1A2B3C4D5E6F7
  - key: alternateDomains
    label: Alternate domain names
    type: list
    placeholder: www.example.com
  - key: origins
    label: Origins
    type: list
    placeholder: "S3 bucket, ALB or custom origin"
  - key: priceClass
    label: Price class
    type: select
    defaultValue: all
    options:
      - value: all
        label: All edge locations
      - value: "200"
        label: Price class 200
      - value: "100"
        label: Price class 100
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the cache behaviours and security settings.
