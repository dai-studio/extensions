# dai.types.cloud.relational-database
name: "Relational Database"
version: 1.0.0
description: "A managed or self-hosted SQL database."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" /></svg>
order: 400
colors:
  fill: '#EDF1FA'
  stroke: '#3A5BB8'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Relational Database name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: engine
    label: "Engine"
    type: select
    defaultValue: "postgres"
    options:
      - value: "postgres"
        label: "PostgreSQL"
      - value: "mysql"
        label: "MySQL"
      - value: "mariadb"
        label: "MariaDB"
      - value: "sqlserver"
        label: "SQL Server"
      - value: "oracle"
        label: "Oracle"
      - value: "sqlite"
        label: "SQLite"
      - value: "other"
        label: "Other"
  - key: engineVersion
    label: "Engine version"
    type: text
    placeholder: "e.g. 17"
  - key: highlyAvailable
    label: "Multi-zone / high availability"
    type: boolean
  - key: readReplicas
    label: "Read replicas"
    type: number
    defaultValue: 0
    min: 0
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Schema ownership, backups, retention and who connects."
