# dai.types.cloud.region
name: "Region"
version: 1.0.0
description: "A geographic cloud region. Put it inside a Cloud or Account; it contains Availability Zones, Virtual Networks and regional services."
icon: "▢"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" /><path d="M3.6 9h16.8" /><path d="M3.6 15h16.8" /><path d="M11.5 3a17 17 0 0 0 0 18" /><path d="M12.5 3a17 17 0 0 1 0 18" /></svg>
order: 30
colors:
  fill: '#F8FAFC'
  stroke: '#64748B'
bpmnType: bpmn:SubProcess
isExpanded: true
defaultWidth: 600
defaultHeight: 400
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Region name"
  - key: regionCode
    label: "Region"
    type: text
    placeholder: "e.g. us-east-1, westeurope, europe-west1"
  - key: dataResidency
    label: "Data residency"
    type: text
    placeholder: "e.g. EU only"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Why this region was chosen, plus any data residency or latency requirements."
