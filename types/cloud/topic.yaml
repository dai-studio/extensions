# dai.types.cloud.topic
name: "Pub/Sub Topic"
version: 1.0.0
description: "A publish/subscribe topic that fans messages out to many subscribers, such as SNS, Pub/Sub or Service Bus topics."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
order: 510
colors:
  fill: '#FDF2F8'
  stroke: '#DB2777'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Pub/Sub Topic name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: subscribers
    label: "Subscribers"
    type: list
    placeholder: "billing-service"
  - key: delivery
    label: "Delivery"
    type: select
    defaultValue: "push"
    options:
      - value: "push"
        label: "Push"
      - value: "pull"
        label: "Pull"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Message schema, publishers and filtering rules."
