# dai.types.cloud.instance-group
name: "Instance Group"
version: 1.0.0
description: "A group of identical Virtual Machines that scales automatically, such as an Auto Scaling group, VM scale set or managed instance group. Put it inside a Subnet; it contains Virtual Machines."
icon: "▢"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-8 4l8 4l8 -4l-8 -4" /><path d="M4 12l8 4l8 -4" /><path d="M4 16l8 4l8 -4" /></svg>
order: 70
colors:
  fill: '#F8FAFC'
  stroke: '#64748B'
bpmnType: bpmn:SubProcess
isExpanded: true
defaultWidth: 250
defaultHeight: 200
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Instance Group name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: minSize
    label: "Minimum size"
    type: number
    defaultValue: 1
    min: 0
  - key: maxSize
    label: "Maximum size"
    type: number
    defaultValue: 3
    min: 0
  - key: desiredSize
    label: "Desired size"
    type: number
    defaultValue: 2
    min: 0
  - key: scalingPolicy
    label: "Scaling policy"
    type: text
    placeholder: "e.g. target 60% CPU"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What the group runs and how it scales."
