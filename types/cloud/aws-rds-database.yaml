# dai.types.cloud.aws-rds-database
name: Amazon RDS Database
version: 1.0.0
description: An Amazon RDS or Aurora relational database.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" /></svg>
order: 400
colors:
  fill: '#FBF0FC'
  stroke: '#C925D1'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: RDS Database name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: engine
    label: Engine
    type: select
    options:
      - value: aurora-postgresql
        label: Aurora PostgreSQL
      - value: aurora-mysql
        label: Aurora MySQL
      - value: postgres
        label: PostgreSQL
      - value: mysql
        label: MySQL
      - value: mariadb
        label: MariaDB
      - value: oracle
        label: Oracle
      - value: sqlserver
        label: SQL Server
  - key: version
    label: Engine version
    type: text
    placeholder: "16.4"
  - key: instanceClass
    label: Instance class
    type: text
    placeholder: db.r7g.large
  - key: multiAz
    label: Multi-AZ
    type: boolean
  - key: storageGiB
    label: Storage (GiB)
    type: number
    min: 20
  - key: securityGroups
    label: Security groups
    type: list
    placeholder: sg-0123456789abcdef0
    hint: Security groups attached to this resource. Model each one as an AWS Security Group node.
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: "Describe the schema, backups and replicas."
