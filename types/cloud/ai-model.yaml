# dai.types.cloud.ai-model
name: "AI Model Endpoint"
version: 1.0.0
description: "A hosted AI model that applications call, such as Bedrock, Azure AI Foundry, Vertex AI, Workers AI or a self-hosted model."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8" /><path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8" /><path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5" /><path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0" /><path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5" /><path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10" /></svg>
order: 800
colors:
  fill: '#F1F5F9'
  stroke: '#475569'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "AI Model Endpoint name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: modelId
    label: "Model"
    type: text
    placeholder: "e.g. claude-sonnet, gpt-4o, llama-3.1-8b"
  - key: modality
    label: "Modality"
    type: select
    defaultValue: "text"
    options:
      - value: "text"
        label: "Text"
      - value: "multimodal"
        label: "Multimodal"
      - value: "image"
        label: "Image"
      - value: "embedding"
        label: "Embedding"
      - value: "speech"
        label: "Speech"
  - key: hosting
    label: "Hosting"
    type: select
    defaultValue: "managed"
    options:
      - value: "managed"
        label: "Managed API"
      - value: "dedicated"
        label: "Dedicated endpoint"
      - value: "self-hosted"
        label: "Self-hosted"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What the model is used for, prompts, and cost or latency limits."
