# dai.types.cloud.aws-sqs-queue
name: AWS SQS Queue
version: 1.0.0
description: An AWS SQS message queue.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2l0 -12" /><path d="M4 13h3l3 3h4l3 -3h3" /></svg>
order: 500
colors:
  fill: '#FDEFF6'
  stroke: '#E7157B'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: SQS Queue name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: queueType
    label: Queue type
    type: select
    defaultValue: standard
    options:
      - value: standard
        label: Standard
      - value: fifo
        label: FIFO
  - key: visibilityTimeoutSeconds
    label: Visibility timeout (s)
    type: number
    defaultValue: 30
    min: 0
    max: 43200
  - key: messageRetentionSeconds
    label: Retention (s)
    type: number
    defaultValue: 345600
    min: 60
    max: 1209600
  - key: deadLetterQueue
    label: Dead-letter queue
    type: text
    placeholder: Queue name or ARN
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: "Describe the producers, consumers and message format."
