# dai.types.cloud.block-storage
name: "Block Storage"
version: 1.0.0
description: "A disk volume attached to a Virtual Machine, such as EBS, Azure Managed Disk or Persistent Disk."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h10l4 4v10a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2" /><path d="M10 14a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M14 4l0 4l-6 0l0 -4" /></svg>
order: 310
colors:
  fill: '#F0FDFA'
  stroke: '#0D9488'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Block Storage name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: sizeGb
    label: "Size (GB)"
    type: number
    defaultValue: 100
    min: 1
  - key: performanceTier
    label: "Performance"
    type: select
    defaultValue: "balanced"
    options:
      - value: "standard"
        label: "Standard (HDD)"
      - value: "balanced"
        label: "Balanced (SSD)"
      - value: "high"
        label: "High IOPS (SSD)"
  - key: encrypted
    label: "Encrypted"
    type: boolean
    defaultValue: true
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What the volume holds and how it is backed up."
