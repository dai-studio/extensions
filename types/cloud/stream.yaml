# dai.types.cloud.stream
name: "Data Stream"
version: 1.0.0
description: "An ordered, replayable stream of records, such as Kinesis, Event Hubs or Kafka."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12h-2c-.894 0 -1.662 -.857 -1.761 -2c-.296 -3.45 -.749 -6 -2.749 -6s-2.5 3.582 -2.5 8s-.5 8 -2.5 8s-2.452 -2.547 -2.749 -6c-.1 -1.147 -.867 -2 -1.763 -2h-2" /></svg>
order: 530
colors:
  fill: '#F1F5F9'
  stroke: '#475569'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Data Stream name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: partitions
    label: "Partitions / shards"
    type: number
    defaultValue: 1
    min: 1
  - key: retentionHours
    label: "Retention (hours)"
    type: number
    defaultValue: 24
    min: 1
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Record schema, producers, consumers and throughput."
