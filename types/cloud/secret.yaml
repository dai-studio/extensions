# dai.types.cloud.secret
name: "Secret"
version: 1.0.0
description: "A stored credential, such as an API key, password or connection string, kept in a secrets manager or key vault."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -6" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" /><path d="M15 16h.01" /><path d="M12.01 16h.01" /><path d="M9.02 16h.01" /></svg>
order: 610
colors:
  fill: '#FEF2F2'
  stroke: '#DC2626'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Secret name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: secretName
    label: "Secret name"
    type: text
    placeholder: "prod/db/password"
  - key: rotationDays
    label: "Rotation (days)"
    type: number
    defaultValue: 90
    min: 0
    hint: "Use 0 when the secret is not rotated."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What the secret unlocks and who can read it."
