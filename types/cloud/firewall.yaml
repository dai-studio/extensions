# dai.types.cloud.firewall
name: "Firewall Rules"
version: 1.0.0
description: "A set of network allow/deny rules, such as a security group, network security group or VPC firewall rule. Connect it to the resources it protects."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" /><path d="M11 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M12 12l0 2.5" /></svg>
order: 200
colors:
  fill: '#FEF2F2'
  stroke: '#DC2626'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Firewall Rules name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: direction
    label: "Direction"
    type: select
    defaultValue: "ingress"
    options:
      - value: "ingress"
        label: "Ingress"
      - value: "egress"
        label: "Egress"
      - value: "both"
        label: "Both"
  - key: rules
    label: "Rules"
    type: list
    placeholder: "allow tcp 443 from 0.0.0.0/0"
  - key: defaultAction
    label: "Default action"
    type: select
    defaultValue: "deny"
    options:
      - value: "deny"
        label: "Deny"
      - value: "allow"
        label: "Allow"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Why each rule exists and who owns changes to it."
