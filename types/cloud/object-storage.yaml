# dai.types.cloud.object-storage
name: "Object Storage"
version: 1.0.0
description: "A bucket or container for objects, such as Amazon S3, Azure Blob Storage, Cloud Storage or R2."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a8 4 0 1 0 16 0a8 4 0 1 0 -16 0" /><path d="M4 7c0 .664 .088 1.324 .263 1.965l2.737 10.035c.5 1.5 2.239 2 5 2s4.5 -.5 5 -2c.333 -1 1.246 -4.345 2.737 -10.035a7.45 7.45 0 0 0 .263 -1.965" /></svg>
order: 300
colors:
  fill: '#F0FDFA'
  stroke: '#0D9488'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Object Storage name"
  - key: resourceId
    label: "Resource ID"
    type: text
    placeholder: "Provider-specific ID, ARN or URI"
    hint: "Fill this in once the resource exists or a provider is chosen."
  - key: bucketName
    label: "Bucket name"
    type: text
    placeholder: "my-bucket"
  - key: storageClass
    label: "Storage class"
    type: select
    defaultValue: "hot"
    options:
      - value: "hot"
        label: "Hot / standard"
      - value: "cool"
        label: "Cool / infrequent access"
      - value: "archive"
        label: "Archive"
  - key: versioning
    label: "Versioning"
    type: boolean
  - key: publicAccess
    label: "Public access"
    type: boolean
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What is stored, retention and lifecycle rules, and who can read it."
