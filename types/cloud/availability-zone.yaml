# dai.types.cloud.availability-zone
name: "Availability Zone"
version: 1.0.0
description: "An isolated failure domain within a Region. Put it inside a Region or Virtual Network; it contains Subnets or zonal resources."
icon: "▢"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18.5l-3 -1.5l-6 3v-13l6 -3l6 3l6 -3v7.5" /><path d="M9 4v13" /><path d="M15 7v5.5" /><path d="M21.121 20.121a3 3 0 1 0 -4.242 0c.418 .419 1.125 1.045 2.121 1.879c1.051 -.89 1.759 -1.516 2.121 -1.879" /><path d="M19 18v.01" /></svg>
order: 40
colors:
  fill: '#F8FAFC'
  stroke: '#64748B'
bpmnType: bpmn:SubProcess
isExpanded: true
defaultWidth: 600
defaultHeight: 400
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Availability Zone name"
  - key: zoneId
    label: "Zone"
    type: text
    placeholder: "e.g. us-east-1a, zone 1, europe-west1-b"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "What is placed in this zone and how it fails over."
