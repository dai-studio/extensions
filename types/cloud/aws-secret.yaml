# dai.types.cloud.aws-secret
name: AWS Secrets Manager Secret
version: 1.0.0
description: A secret stored in AWS Secrets Manager.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -6" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" /><path d="M15 16h.01" /><path d="M12.01 16h.01" /><path d="M9.02 16h.01" /></svg>
order: 620
colors:
  fill: '#FDF1F2'
  stroke: '#DD344C'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Secrets Manager Secret name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: secretName
    label: Secret name
    type: text
    placeholder: prod/app/db
  - key: rotationEnabled
    label: Rotation enabled
    type: boolean
  - key: rotationDays
    label: Rotation interval (days)
    type: number
    defaultValue: 30
    min: 1
    max: 1000
  - key: kmsKey
    label: KMS key
    type: text
    placeholder: alias/aws/secretsmanager
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what the secret holds (never paste the secret itself) and who reads it.
