# dai.types.cloud.cloud-provider
name: "Cloud"
version: 1.0.0
description: "A cloud provider boundary. Use it to group everything that runs on one provider, or leave the provider open while the architecture is still vendor-neutral. It contains Accounts or Regions."
icon: "☁"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878" /></svg>
order: 10
colors:
  fill: '#F8FAFC'
  stroke: '#64748B'
bpmnType: bpmn:SubProcess
isExpanded: true
defaultWidth: 600
defaultHeight: 400
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Cloud name"
  - key: provider
    label: "Provider"
    type: select
    defaultValue: "undecided"
    hint: "Choose Other for a provider that is not listed and name it in Notes."
    options:
      - value: "undecided"
        label: "Not decided yet"
      - value: "aws"
        label: "AWS"
      - value: "azure"
        label: "Microsoft Azure"
      - value: "gcp"
        label: "Google Cloud"
      - value: "cloudflare"
        label: "Cloudflare"
      - value: "oracle"
        label: "Oracle Cloud"
      - value: "ibm"
        label: "IBM Cloud"
      - value: "alibaba"
        label: "Alibaba Cloud"
      - value: "digitalocean"
        label: "DigitalOcean"
      - value: "other"
        label: "Other"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Why this provider, and any multi-cloud or exit requirements."
