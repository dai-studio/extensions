# dai.types.cloud.aws-kinesis-stream
name: AWS Kinesis Data Stream
version: 1.0.0
description: An AWS Kinesis data stream for real-time streaming data.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12h-2c-.894 0 -1.662 -.857 -1.761 -2c-.296 -3.45 -.749 -6 -2.749 -6s-2.5 3.582 -2.5 8s-.5 8 -2.5 8s-2.452 -2.547 -2.749 -6c-.1 -1.147 -.867 -2 -1.763 -2h-2" /></svg>
order: 530
colors:
  fill: '#FDEFF6'
  stroke: '#E7157B'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Kinesis Data Stream name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: capacityMode
    label: Capacity mode
    type: select
    defaultValue: on-demand
    options:
      - value: on-demand
        label: On-demand
      - value: provisioned
        label: Provisioned
  - key: shardCount
    label: Shards
    type: number
    min: 1
  - key: retentionHours
    label: Retention (hours)
    type: number
    defaultValue: 24
    min: 24
    max: 8760
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: "Describe the producers, consumers and record format."
