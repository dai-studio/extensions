# dai.types.oss-messaging.emqx
name: "EMQX"
version: 1.0.0
description: "EMQX, a scalable MQTT broker for IoT. Place it inside an OS, container host or Kubernetes cluster. License: BUSL-1.1 (source-available)."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
order: 320
group: iot
colors:
  fill: '#FFFBEB'
  stroke: '#D97706'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "EMQX name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: deployment
    label: "Deployment"
    type: select
    defaultValue: "container"
    options:
      - value: "package"
        label: "OS package / binary"
      - value: "container"
        label: "Container"
      - value: "kubernetes"
        label: "Kubernetes (Helm / operator)"
      - value: "managed"
        label: "Managed service"
  - key: port
    label: "Port"
    type: number
    defaultValue: 1883
    min: 0
  - key: replicas
    label: "Replicas"
    type: number
    defaultValue: 1
    min: 0
  - key: endpoint
    label: "Endpoint"
    type: text
    placeholder: "host:port or URL"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Topology, persistence, backups, scaling and who connects."
