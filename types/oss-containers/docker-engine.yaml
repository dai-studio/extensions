# dai.types.oss-containers.docker-engine
name: "Docker Engine"
version: 1.0.0
description: "Docker Engine (Moby), the daemon and CLI for building and running containers on a host. Contains the containerised services it runs; place it inside an OS. License: Apache-2.0."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5l0 9l-8 4.5l-8 -4.5l0 -9l8 -4.5" /><path d="M12 12l8 -4.5" /><path d="M12 12l0 9" /><path d="M12 12l-8 -4.5" /></svg>
order: 110
group: container-runtime
colors:
  fill: '#F0F9FF'
  stroke: '#0284C7'
bpmnType: bpmn:SubProcess
isExpanded: true
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Docker Engine name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: nodeCount
    label: "Nodes"
    type: number
    defaultValue: 1
    min: 0
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Sizing, hardening, patching and what runs on it."
