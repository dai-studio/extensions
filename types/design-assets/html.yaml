# dai.types.design-assets.html
name: "HTML"
version: 1.0.0
description: "A reusable HTML snippet with optional CSS. Nest it anywhere: an element applies within its parent."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l-4 4l4 4" /><path d="M17 8l4 4l-4 4" /><path d="M14 4l-4 16" /></svg>
order: 20
colors:
  fill: '#F0FDF4'
  stroke: '#16A34A'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Snippet name"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <span class="dai-badge">New</span>
      <span class="dai-badge dai-badge--muted">Beta</span>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-badge {
        display: inline-block;
        padding: 0.125rem var(--dai-space-2, 0.5rem);
        border-radius: var(--dai-radius-full, 9999px);
        font: 600 0.75rem / 1.5 var(--dai-font-sans, system-ui, sans-serif);
        background: var(--dai-color-primary, #2563eb);
        color: var(--dai-color-primary-contrast, #ffffff);
      }

      .dai-badge--muted {
        background: var(--dai-color-surface-alt, #f8fafc);
        color: var(--dai-color-text-muted, #475569);
      }
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "What it is for and how to adapt it."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Source and caveats."
