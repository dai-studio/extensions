# dai.types.software.job
name: "Job"
version: 1.0.0
description: "A background or scheduled worker that runs to completion: triggered by a schedule, a queue, an event or by hand. Pipeline stays CI/CD."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 0 -9.002 9" /><path d="M17.001 19a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M19.001 15.5v1.5" /><path d="M19.001 21v1.5" /><path d="M22.032 17.25l-1.299 .75" /><path d="M17.27 20l-1.3 .75" /><path d="M15.97 17.25l1.3 .75" /><path d="M20.733 20l1.3 .75" /><path d="M12 7v5l2 2" /></svg>
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Job name"
  - key: trigger
    label: "Trigger"
    type: select
    defaultValue: "schedule"
    options:
      - value: "schedule"
        label: "Schedule"
      - value: "queue"
        label: "Queue"
      - value: "event"
        label: "Event"
      - value: "manual"
        label: "Manual"
  - key: schedule
    label: "Schedule"
    type: text
    placeholder: "Cron, e.g. 0 3 * * *"
  - key: runtime
    label: "Runtime"
    type: text
    placeholder: "e.g. Node.js worker, Sidekiq, Celery"
  - key: timeout
    label: "Timeout"
    type: text
    placeholder: "e.g. 15m"
  - key: retries
    label: "Retries"
    type: number
    defaultValue: 3
    min: 0
  - key: idempotent
    label: "Idempotent"
    type: boolean
    defaultValue: false
  - key: owner
    label: "Owner"
    type: text
    placeholder: "Responsible person or team"
  - key: notes
    label: "Notes"
    type: textarea
