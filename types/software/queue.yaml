# dai.types.software.queue
name: "Queue"
version: 1.0.0
description: "A message queue, topic or stream that carries messages between services. Event describes the message contract; Queue is the channel it travels on."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-8 4l8 4l8 -4l-8 -4" /><path d="M4 12l8 4l8 -4" /><path d="M4 16l8 4l8 -4" /></svg>
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Queue name"
  - key: broker
    label: "Technology"
    type: select
    options:
      - value: "rabbitmq"
        label: "RabbitMQ"
      - value: "kafka"
        label: "Kafka"
      - value: "sqs"
        label: "SQS"
      - value: "nats"
        label: "NATS"
      - value: "redis"
        label: "Redis"
      - value: "pubsub"
        label: "Pub/Sub"
      - value: "other"
        label: "Other"
  - key: pattern
    label: "Pattern"
    type: select
    defaultValue: "queue"
    options:
      - value: "queue"
        label: "Queue (point-to-point)"
      - value: "topic"
        label: "Topic (pub/sub)"
      - value: "stream"
        label: "Stream"
  - key: producer
    label: "Producers"
    type: text
  - key: consumers
    label: "Consumers"
    type: text
  - key: delivery
    label: "Delivery guarantee"
    type: select
    options:
      - value: "at-most-once"
        label: "At most once"
      - value: "at-least-once"
        label: "At least once"
      - value: "exactly-once"
        label: "Exactly once"
  - key: deadLetter
    label: "Dead-letter queue"
    type: text
  - key: notes
    label: "Notes"
    type: textarea
