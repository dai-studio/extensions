# dai.types.software.config
name: "Config"
version: 1.0.0
description: "Configuration for a service or environment: settings, feature switches and secret references, and where they come from."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M6 4v4" /><path d="M6 12v8" /><path d="M10 16a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M12 4v10" /><path d="M12 18v2" /><path d="M16 7a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M18 4v1" /><path d="M18 9v11" /></svg>
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Config name"
  - key: format
    label: "Format"
    type: select
    options:
      - value: "env"
        label: ".env / environment variables"
      - value: "yaml"
        label: "YAML"
      - value: "json"
        label: "JSON"
      - value: "toml"
        label: "TOML"
      - value: "properties"
        label: "Properties"
      - value: "other"
        label: "Other"
  - key: source
    label: "Source"
    type: select
    options:
      - value: "file"
        label: "File"
      - value: "config-service"
        label: "Config service"
      - value: "vault"
        label: "Secrets manager / vault"
      - value: "env"
        label: "Environment"
      - value: "other"
        label: "Other"
  - key: path
    label: "Path / key"
    type: text
    placeholder: "e.g. config/production.yaml"
  - key: settings
    label: "Settings"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
