        label: Basic Auth
  - key: requestBody
    label: Request Schema
    type: code
    placeholder: |-
      {
        "field": "type"
      }
  - key: responseBody
    label: Response Schema
    type: code
    placeholder: |-
      {
        "field": "type"
      }
  - key: notes
    label: Description
    type: textarea
    placeholder: What does this endpoint do? Include any important behaviour or limitations.
