form:
  - key: name
    label: Name
    type: text
    placeholder: Endpoint name (e.g. "Create Order")
  - key: service
    label: Service
    type: text
    placeholder: Which service owns this endpoint?
    hint: Type the name of a Service, or draw a connection from a Service element on canvas to this endpoint to link them.
  - key: method
    label: HTTP Method
    type: select
    options:
      - value: GET
        label: GET
      - value: POST
        label: POST
      - value: PUT
        label: PUT
      - value: PATCH
        label: PATCH
      - value: DELETE
        label: DELETE
      - value: OPTIONS
        label: OPTIONS
  - key: path
    label: Path
    type: text
    placeholder: /api/v1/resource/{id}
  - key: statusCode
    label: Status Code
    type: text
    placeholder: e.g. 200, 201, 204
  - key: authType
    label: Auth
    type: select
    options:
      - value: none
        label: None
