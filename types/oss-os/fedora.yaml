# dai.types.oss-os.fedora
name: "Fedora"
version: 1.0.0
description: "Fedora Linux, the fast-moving community distribution upstream of CentOS Stream and RHEL. Contains the runtimes, containers and services installed on it; place it inside a hypervisor, private cloud or data center. License: Various OSI licenses (mainly GPL)."
icon: "▢"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-2" /><path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2" /><path d="M7 8l0 .01" /><path d="M7 16l0 .01" /></svg>
order: 130
group: linux
colors:
  fill: '#FAFAF9'
  stroke: '#57534E'
bpmnType: bpmn:SubProcess
isExpanded: true
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Fedora name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: architecture
    label: "Architecture"
    type: select
    defaultValue: "amd64"
    options:
      - value: "amd64"
        label: "x86-64 (amd64)"
      - value: "arm64"
        label: "ARM64 (aarch64)"
      - value: "other"
        label: "Other"
  - key: nodeCount
    label: "Hosts"
    type: number
    defaultValue: 1
    min: 0
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Sizing, hardening, patching and what runs on it."
