# dai.types.gcp.api-gateway
name: API Gateway
version: 1.0.0
description: A Google Cloud API Gateway or Apigee proxy that publishes, secures and meters APIs.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h5" /><path d="M12 16v-8h3a2 2 0 0 1 2 2v1a2 2 0 0 1 -2 2h-3" /><path d="M20 8v8" /><path d="M9 16v-5.5a2.5 2.5 0 0 0 -5 0v5.5" /></svg>
order: 280
colors:
  fill: '#E6F4EA'
  stroke: '#188038'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: API Gateway name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: product
    label: Product
    type: select
    defaultValue: api-gateway
    options:
      - value: api-gateway
        label: API Gateway
      - value: apigee
        label: Apigee
  - key: gatewayUrl
    label: Gateway URL
    type: text
    placeholder: https://gw-abc123.uc.gateway.dev
  - key: apis
    label: APIs
    type: list
    placeholder: orders-api
  - key: backend
    label: Backend
    type: text
    placeholder: Cloud Run service
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the APIs, auth and quotas.
