# dai.types.gcp.service-account
name: Service Account
version: 1.0.0
description: A Google Cloud service account, an identity that workloads use to call Google APIs.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21v-2a4 4 0 0 1 4 -4h2" /><path d="M22 16c0 4 -2.5 6 -3.5 6s-3.5 -2 -3.5 -6c1 0 2.5 -.5 3.5 -1.5c1 1 2.5 1.5 3.5 1.5" /><path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" /></svg>
order: 600
colors:
  fill: '#FCE8E6'
  stroke: '#C5221F'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Service Account name
  - key: email
    label: Email
    type: text
    placeholder: app@project.iam.gserviceaccount.com
  - key: roles
    label: Roles
    type: list
    placeholder: roles/storage.objectViewer on bucket
  - key: workloadIdentityBindings
    label: Workload Identity bindings
    type: list
    placeholder: ns/app-ksa
  - key: keysAllowed
    label: User-managed keys allowed
    type: boolean
    defaultValue: false
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe who uses this identity and what it can access.
