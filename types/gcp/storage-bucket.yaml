# dai.types.gcp.storage-bucket
name: Cloud Storage Bucket
version: 1.0.0
description: A Google Cloud Storage bucket for object storage.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a8 4 0 1 0 16 0a8 4 0 1 0 -16 0" /><path d="M4 7c0 .664 .088 1.324 .263 1.965l2.737 10.035c.5 1.5 2.239 2 5 2s4.5 -.5 5 -2c.333 -1 1.246 -4.345 2.737 -10.035a7.45 7.45 0 0 0 .263 -1.965" /></svg>
order: 300
colors:
  fill: '#FEF7E0'
  stroke: '#B06000'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Cloud Storage Bucket name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: bucketName
    label: Bucket name
    type: text
    placeholder: my-app-uploads
    hint: Globally unique.
  - key: locationType
    label: Location type
    type: select
    options:
      - value: region
        label: Region
      - value: dual-region
        label: Dual-region
      - value: multi-region
        label: Multi-region
  - key: location
    label: Location
    type: text
    placeholder: us-central1 or US
  - key: storageClass
    label: Storage class
    type: select
    defaultValue: standard
    options:
      - value: standard
        label: Standard
      - value: nearline
        label: Nearline
      - value: coldline
        label: Coldline
      - value: archive
        label: Archive
  - key: uniformAccess
    label: Uniform bucket-level access
    type: boolean
    defaultValue: true
  - key: publicAccessPrevention
    label: Public access prevention
    type: boolean
    defaultValue: true
  - key: versioning
    label: Object versioning
    type: boolean
  - key: lifecycleRules
    label: Lifecycle rules
    type: list
    placeholder: delete tmp/ after 7 days
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what is stored and who reads it.
