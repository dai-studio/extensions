# dai.types.gcp.kms-key
name: Cloud KMS Key
version: 1.0.0
description: A Google Cloud KMS key for encryption, signing or MAC, held in a key ring.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -6" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" /><path d="M15 16h.01" /><path d="M12.01 16h.01" /><path d="M9.02 16h.01" /></svg>
order: 620
colors:
  fill: '#FCE8E6'
  stroke: '#C5221F'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Cloud KMS Key name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: keyRing
    label: Key ring
    type: text
    placeholder: app-keys
  - key: purpose
    label: Purpose
    type: select
    defaultValue: encrypt-decrypt
    options:
      - value: encrypt-decrypt
        label: Symmetric encrypt/decrypt
      - value: asymmetric-sign
        label: Asymmetric sign
      - value: asymmetric-decrypt
        label: Asymmetric decrypt
      - value: mac
        label: MAC signing
  - key: protectionLevel
    label: Protection level
    type: select
    defaultValue: software
    options:
      - value: software
        label: Software
      - value: hsm
        label: HSM
      - value: external
        label: External (EKM)
  - key: rotationPeriod
    label: Rotation period
    type: text
    placeholder: 90d
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe which resources use this key.
