# dai.types.gcp.managed-instance-group
name: Managed Instance Group
version: 1.0.0
description: A Google Cloud managed instance group (MIG) of identical, autoscaled and autohealed VMs. Put it inside a Subnet or Region; it contains Compute Instances.
icon: ▢
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-8 4l8 4l8 -4l-8 -4" /><path d="M4 12l8 4l8 -4" /><path d="M4 16l8 4l8 -4" /></svg>
order: 70
colors:
  fill: '#E8F0FE'
  stroke: '#1A73E8'
bpmnType: bpmn:SubProcess
isExpanded: true
defaultWidth: 250
defaultHeight: 150
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Managed Instance Group name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: instanceTemplate
    label: Instance template
    type: text
    placeholder: web-template-v3
  - key: scope
    label: Scope
    type: select
    defaultValue: regional
    options:
      - value: zonal
        label: Zonal
      - value: regional
        label: Regional
  - key: minReplicas
    label: Min instances
    type: number
    min: 0
  - key: maxReplicas
    label: Max instances
    type: number
    min: 0
  - key: autoscalingSignal
    label: Autoscaling signal
    type: text
    placeholder: CPU 60%
  - key: networkTags
    label: Network tags
    type: list
    placeholder: web
    hint: Firewall rules target these tags.
  - key: serviceAccount
    label: Service account
    type: text
    placeholder: app@project.iam.gserviceaccount.com
    hint: Model it as a Service Account node.
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the autoscaling policy and what the instances run.
