# dai.types.gcp.bigquery-dataset
name: BigQuery Dataset
version: 1.0.0
description: A Google BigQuery dataset, a container for tables and views in the serverless data warehouse.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l16 0" /><path d="M4 15l4 -6l4 2l4 -5l4 4" /></svg>
order: 440
colors:
  fill: '#EDF1FA'
  stroke: '#3A5BB8'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: BigQuery Dataset name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: datasetId
    label: Dataset ID
    type: text
    placeholder: analytics
  - key: location
    label: Location
    type: text
    placeholder: US
  - key: tables
    label: Tables
    type: list
    placeholder: events
  - key: defaultTableExpirationDays
    label: Default table expiration (days)
    type: number
    min: 0
  - key: pricingModel
    label: Pricing model
    type: select
    defaultValue: on-demand
    options:
      - value: on-demand
        label: On-demand
      - value: editions
        label: Editions (capacity)
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the data, its sources and who queries it.
