# dai.types.gcp.spanner
name: Spanner
version: 1.0.0
description: A Google Cloud Spanner instance, a globally consistent, horizontally scalable database.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" /><path d="M3 10h18" /><path d="M10 3v18" /></svg>
order: 410
colors:
  fill: '#EDF1FA'
  stroke: '#3A5BB8'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Spanner name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: edition
    label: Edition
    type: select
    options:
      - value: standard
        label: Standard
      - value: enterprise
        label: Enterprise
      - value: enterprise-plus
        label: Enterprise Plus
  - key: configuration
    label: Configuration
    type: text
    placeholder: regional-us-central1 or nam6
  - key: processingUnits
    label: Processing units
    type: number
    min: 100
    step: 100
  - key: databases
    label: Databases
    type: list
    placeholder: orders
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the schema, interleaving and access patterns.
