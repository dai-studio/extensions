# dai.types.gcp.compute-instance
name: Compute Instance
version: 1.0.0
description: A Google Compute Engine virtual machine. Usually placed inside a Subnet, Zone or Managed Instance Group.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-2" /><path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2" /><path d="M7 8l0 .01" /><path d="M7 16l0 .01" /></svg>
order: 100
colors:
  fill: '#E8F0FE'
  stroke: '#1A73E8'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Compute Instance name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: machineType
    label: Machine type
    type: text
    placeholder: e2-standard-4
  - key: image
    label: Image
    type: text
    placeholder: debian-12
  - key: provisioningModel
    label: Provisioning model
    type: select
    defaultValue: standard
    options:
      - value: standard
        label: Standard
      - value: spot
        label: Spot
  - key: commitment
    label: Committed use
    type: select
    defaultValue: none
    options:
      - value: none
        label: None
      - value: 1-year
        label: 1 year
      - value: 3-year
        label: 3 years
  - key: networkTags
    label: Network tags
    type: list
    placeholder: web
    hint: Firewall rules target these tags.
  - key: serviceAccount
    label: Service account
    type: text
    placeholder: app@project.iam.gserviceaccount.com
    hint: Model it as a Service Account node.
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what runs on this instance.
