# dai.types.gcp.cloud-sql
name: Cloud SQL
version: 1.0.0
description: A Google Cloud SQL instance (PostgreSQL, MySQL or SQL Server) or an AlloyDB cluster.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" /></svg>
order: 400
colors:
  fill: '#EDF1FA'
  stroke: '#3A5BB8'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Cloud SQL name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: engine
    label: Engine
    type: select
    options:
      - value: postgres
        label: PostgreSQL
      - value: mysql
        label: MySQL
      - value: sqlserver
        label: SQL Server
      - value: alloydb
        label: AlloyDB for PostgreSQL
  - key: version
    label: Engine version
    type: text
    placeholder: "16"
  - key: machineType
    label: Machine type
    type: text
    placeholder: db-custom-4-16384
  - key: edition
    label: Edition
    type: select
    options:
      - value: enterprise
        label: Enterprise
      - value: enterprise-plus
        label: Enterprise Plus
  - key: highAvailability
    label: High availability
    type: boolean
  - key: privateIp
    label: Private IP only
    type: boolean
  - key: storageGb
    label: Storage (GB)
    type: number
    min: 10
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the schema, backups and replicas.
