# dai.types.gcp.secret
name: Secret Manager Secret
version: 1.0.0
description: A Google Cloud Secret Manager secret, such as an API key or database password.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -6" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" /><path d="M15 16h.01" /><path d="M12.01 16h.01" /><path d="M9.02 16h.01" /></svg>
order: 610
colors:
  fill: '#FCE8E6'
  stroke: '#C5221F'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Secret Manager Secret name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: secretId
    label: Secret ID
    type: text
    placeholder: db-password
  - key: replication
    label: Replication
    type: select
    defaultValue: automatic
    options:
      - value: automatic
        label: Automatic
      - value: user-managed
        label: User-managed
  - key: rotationPeriod
    label: Rotation period
    type: text
    placeholder: 90d
  - key: accessors
    label: Accessors
    type: list
    placeholder: app@project.iam.gserviceaccount.com
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what the secret is for and how it is rotated.
