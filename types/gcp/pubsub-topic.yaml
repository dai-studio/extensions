# dai.types.gcp.pubsub-topic
name: Pub/Sub Topic
version: 1.0.0
description: A Google Cloud Pub/Sub topic for asynchronous publish/subscribe messaging.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
order: 500
colors:
  fill: '#F3E8FD'
  stroke: '#8430CE'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Pub/Sub Topic name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: topicId
    label: Topic ID
    type: text
    placeholder: orders
  - key: schema
    label: Schema
    type: text
    placeholder: order-v1 (Avro)
  - key: retentionDays
    label: Retention (days)
    type: number
    min: 0
    max: 31
  - key: cmek
    label: Customer-managed encryption key
    type: boolean
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the publishers and message format.
