# dai.types.gcp.eventarc-trigger
name: Eventarc Trigger
version: 1.0.0
description: A Google Cloud Eventarc trigger that routes events from Google services or Pub/Sub to a destination.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" /><path d="M10 20h-6" /><path d="M14 20h6" /><path d="M12 15l-2 -2h-3a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h10a1 1 0 0 1 1 1v8a1 1 0 0 1 -1 1h-3l-2 2" /></svg>
order: 520
colors:
  fill: '#F3E8FD'
  stroke: '#8430CE'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Eventarc Trigger name
  - key: resourceName
    label: Resource name
    type: text
    placeholder: projects/…/locations/…/…
  - key: eventType
    label: Event type
    type: text
    placeholder: google.cloud.storage.object.v1.finalized
  - key: filters
    label: Filters
    type: list
    placeholder: bucket=my-app-uploads
  - key: destination
    label: Destination
    type: text
    placeholder: Cloud Run service or Workflow
  - key: serviceAccount
    label: Service account
    type: text
    placeholder: app@project.iam.gserviceaccount.com
    hint: Model it as a Service Account node.
  - key: labels
    label: Labels
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the events and what handles them.
