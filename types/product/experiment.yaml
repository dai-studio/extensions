colors:
  fill: '#fff7ed'
  stroke: '#c2410c'
bpmnType: bpmn:Task
stepType: experiment
license: free
aliases:
  - a1b2c3d4-0005-0001-0001-000000000004
form:
  - key: name
    label: Name
    type: text
    placeholder: Experiment name
  - key: status
    label: Status
    type: select
    options:
      - value: draft
        label: Draft
      - value: running
        label: Running
      - value: complete
        label: Complete
      - value: abandoned
        label: Abandoned
  - key: hypothesis
    label: Hypothesis
    type: textarea
    placeholder: We believe that [change] will result in [outcome] because [rationale].
  - key: audience
    label: Audience
    type: text
    placeholder: Who is included in this experiment? (e.g. "New users, 50/50 split")
  - key: successMetric
    label: Success Metric
    type: text
    placeholder: What measurement determines success? (e.g. "≥10% increase in activation rate")
  - key: result
    label: Result
    type: textarea
    placeholder: What did you learn? Was the hypothesis validated or invalidated?
  - key: notes
    label: Notes
    type: textarea
