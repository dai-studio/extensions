# dai.types.product.insight
name: "Insight"
version: 1.0.0
description: "A learning drawn from research, feedback or data, and what it means for the product. Feedback is the raw input; an Insight is the conclusion."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 18a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m0 -12a2 2 0 0 1 2 2a2 2 0 0 1 2 -2a2 2 0 0 1 -2 -2a2 2 0 0 1 -2 2m-7 12a6 6 0 0 1 6 -6a6 6 0 0 1 -6 -6a6 6 0 0 1 -6 6a6 6 0 0 1 6 6" /></svg>
colors:
  fill: '#fff7ed'
  stroke: '#c2410c'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Insight name"
  - key: evidence
    label: "Evidence"
    type: textarea
  - key: source
    label: "Sources"
    type: text
    placeholder: "e.g. 12 interviews, Q3 NPS survey"
  - key: implication
    label: "Implication"
    type: textarea
    placeholder: "What we should do differently"
  - key: confidence
    label: "Confidence"
    type: select
    options:
      - value: "low"
        label: "Low"
      - value: "medium"
        label: "Medium"
      - value: "high"
        label: "High"
  - key: theme
    label: "Theme"
    type: text
  - key: notes
    label: "Notes"
    type: textarea
