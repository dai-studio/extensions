# dai.types.product.hypothesis
name: "Hypothesis"
version: 1.0.0
description: "A testable belief about a change and its effect: we believe [change] for [who] will [result]; we will know when [signal]. Unlike an Assumption it is not taken as true; an Experiment is how you test it."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7" /><path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3" /><path d="M9.7 17l4.6 0" /></svg>
colors:
  fill: '#fff7ed'
  stroke: '#c2410c'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Hypothesis name"
  - key: hypothesis
    label: "Statement"
    type: textarea
    placeholder: "We believe \u2026 for \u2026 will \u2026 We'll know when \u2026"
  - key: successMetric
    label: "Signal"
    type: text
    placeholder: "e.g. activation +10%"
  - key: confidence
    label: "Confidence"
    type: select
    options:
      - value: "low"
        label: "Low"
      - value: "medium"
        label: "Medium"
      - value: "high"
        label: "High"
  - key: status
    label: "Status"
    type: select
    defaultValue: "untested"
    options:
      - value: "untested"
        label: "Untested"
      - value: "testing"
        label: "Testing"
      - value: "validated"
        label: "Validated"
      - value: "invalidated"
        label: "Invalidated"
  - key: owner
    label: "Owner"
    type: text
    placeholder: "Responsible person or team"
  - key: notes
    label: "Notes"
    type: textarea
