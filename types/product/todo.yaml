# dai.types.product.todo
name: "To-do"
version: 1.0.0
description: "A small action item for the team. Not user value like a Story, and not a defect like Software \u2192 Issue."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3l8 -8" /><path d="M20 12v6a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12a2 2 0 0 1 2 -2h9" /></svg>
colors:
  fill: '#fff7ed'
  stroke: '#c2410c'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "To-do name"
  - key: assignee
    label: "Assignee"
    type: text
  - key: dueDate
    label: "Due"
    type: text
    placeholder: "e.g. 2026-11-01"
  - key: done
    label: "Done"
    type: boolean
    defaultValue: false
  - key: priority
    label: "Priority"
    type: select
    options:
      - value: "high"
        label: "High"
      - value: "medium"
        label: "Medium"
      - value: "low"
        label: "Low"
  - key: notes
    label: "Notes"
    type: textarea
