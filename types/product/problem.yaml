# dai.types.product.problem
name: "Problem"
version: 1.0.0
description: "A user or customer problem worth solving: who has it, the evidence for it, how often and how badly it hurts, and how people cope today."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4" /><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0" /><path d="M12 16h.01" /></svg>
colors:
  fill: '#fff7ed'
  stroke: '#c2410c'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Problem name"
  - key: audience
    label: "Who has it"
    type: text
  - key: evidence
    label: "Evidence"
    type: textarea
    placeholder: "Interviews, tickets, data"
  - key: frequency
    label: "Frequency"
    type: select
    options:
      - value: "rare"
        label: "Rare"
      - value: "occasional"
        label: "Occasional"
      - value: "frequent"
        label: "Frequent"
      - value: "constant"
        label: "Constant"
  - key: severity
    label: "Severity"
    type: select
    options:
      - value: "low"
        label: "Low"
      - value: "medium"
        label: "Medium"
      - value: "high"
        label: "High"
      - value: "critical"
        label: "Critical"
  - key: workaround
    label: "Current workaround"
    type: textarea
  - key: owner
    label: "Owner"
    type: text
    placeholder: "Responsible person or team"
  - key: notes
    label: "Notes"
    type: textarea
