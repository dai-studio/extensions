# dai.types.oss-database.yugabytedb
name: "YugabyteDB"
version: 1.0.0
description: "YugabyteDB, a distributed SQL database compatible with PostgreSQL. Place it inside an OS, container host or Kubernetes cluster. License: Apache-2.0."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" /></svg>
order: 150
group: relational
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "YugabyteDB name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: deployment
    label: "Deployment"
    type: select
    defaultValue: "container"
    options:
      - value: "package"
        label: "OS package / binary"
      - value: "container"
        label: "Container"
      - value: "kubernetes"
        label: "Kubernetes (Helm / operator)"
      - value: "managed"
        label: "Managed service"
  - key: port
    label: "Port"
    type: number
    defaultValue: 5433
    min: 0
  - key: replicas
    label: "Replicas"
    type: number
    defaultValue: 1
    min: 0
  - key: endpoint
    label: "Endpoint"
    type: text
    placeholder: "host:port or URL"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Topology, persistence, backups, scaling and who connects."
