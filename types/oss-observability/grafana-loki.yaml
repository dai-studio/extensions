# dai.types.oss-observability.grafana-loki
name: "Grafana Loki"
version: 1.0.0
description: "Grafana Loki, a log aggregation system that indexes labels, not content. Place it inside an OS, container host or Kubernetes cluster. License: AGPL-3.0."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" /><path d="M9 9l1 0" /><path d="M9 13l6 0" /><path d="M9 17l6 0" /></svg>
order: 210
group: logs
colors:
  fill: '#FDF2F8'
  stroke: '#DB2777'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Grafana Loki name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: deployment
    label: "Deployment"
    type: select
    defaultValue: "container"
    options:
      - value: "package"
        label: "OS package / binary"
      - value: "container"
        label: "Container"
      - value: "kubernetes"
        label: "Kubernetes (Helm / operator)"
      - value: "managed"
        label: "Managed service"
  - key: port
    label: "Port"
    type: number
    defaultValue: 3100
    min: 0
  - key: replicas
    label: "Replicas"
    type: number
    defaultValue: 1
    min: 0
  - key: endpoint
    label: "Endpoint"
    type: text
    placeholder: "host:port or URL"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Topology, persistence, backups, scaling and who connects."
