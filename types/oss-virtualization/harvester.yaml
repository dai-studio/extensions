# dai.types.oss-virtualization.harvester
name: "Harvester"
version: 1.0.0
description: "Harvester, a hyperconverged infrastructure platform built on Kubernetes, KubeVirt and Longhorn. Contains the hypervisors, networks and virtual machines it manages; place it inside a data center. License: Apache-2.0."
