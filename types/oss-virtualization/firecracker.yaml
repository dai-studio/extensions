# dai.types.oss-virtualization.firecracker
name: "Firecracker"
version: 1.0.0
description: "Firecracker, a lightweight KVM-based microVM monitor for serverless and container sandboxing. Contains the virtual machines (OS types) it runs; place it inside a data center or on an OS host. License: Apache-2.0."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4l-8 4l8 4l8 -4l-8 -4" /><path d="M4 12l8 4l8 -4" /><path d="M4 16l8 4l8 -4" /></svg>
order: 160
group: hypervisor
colors:
  fill: '#F8FAFC'
  stroke: '#475569'
bpmnType: bpmn:SubProcess
isExpanded: true
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Firecracker name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: nodeCount
    label: "Nodes"
    type: number
    defaultValue: 1
    min: 0
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
