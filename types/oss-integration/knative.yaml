# dai.types.oss-integration.knative
name: "Knative"
version: 1.0.0
description: "Knative, serverless containers and eventing on Kubernetes. Place it inside a Kubernetes cluster. License: Apache-2.0."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20l6.5 -9" /><path d="M19 20c-6 0 -6 -16 -12 -16" /></svg>
order: 340
group: paas
colors:
  fill: '#ECFDF5'
  stroke: '#059669'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Knative name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: deployment
    label: "Deployment"
    type: select
    defaultValue: "container"
    options:
      - value: "package"
        label: "OS package / binary"
      - value: "container"
        label: "Container"
      - value: "kubernetes"
        label: "Kubernetes (Helm / operator)"
      - value: "managed"
        label: "Managed service"
  - key: replicas
    label: "Replicas"
    type: number
    defaultValue: 1
    min: 0
  - key: endpoint
    label: "Endpoint"
    type: text
    placeholder: "host:port or URL"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Topology, persistence, backups, scaling and who connects."
