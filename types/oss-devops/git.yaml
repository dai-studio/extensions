    label: "Name"
    type: text
    placeholder: "Git name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: configPath
    label: "Config / entry file"
    type: text
    placeholder: ".gitconfig / .gitattributes"
