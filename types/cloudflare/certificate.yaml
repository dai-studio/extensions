# dai.types.cloudflare.certificate
name: Certificate
version: 1.0.0
description: "A TLS certificate on Cloudflare: edge (Universal, Advanced or custom), Origin CA, or client mTLS."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" /><path d="M13 17.5v4.5l2 -1.5l2 1.5v-4.5" /><path d="M10 19h-5a2 2 0 0 1 -2 -2v-10c0 -1.1 .9 -2 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -1 1.73" /><path d="M6 9l12 0" /><path d="M6 12l3 0" /><path d="M6 15l2 0" /></svg>
order: 660
colors:
  fill: '#FDF3F4'
  stroke: '#D13438'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Certificate name
  - key: certType
    label: Type
    type: select
    options:
      - value: universal
        label: Universal
      - value: advanced
        label: Advanced
      - value: custom
        label: Custom (uploaded)
      - value: origin-ca
        label: Origin CA
      - value: client-mtls
        label: Client (mTLS)
  - key: hosts
    label: Hosts
    type: list
    placeholder: "*.example.com"
  - key: validationMethod
    label: Validation
    type: select
    options:
      - value: http
        label: HTTP
      - value: txt
        label: TXT
      - value: email
        label: Email
  - key: expiresOn
    label: Expires on
    type: text
    placeholder: "2027-01-01"
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe where the certificate is used and how it renews.
