# dai.types.cloudflare.r2-bucket
name: R2 Bucket
version: 1.0.0
description: A Cloudflare R2 bucket for S3-compatible object storage with no egress fees.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7a8 4 0 1 0 16 0a8 4 0 1 0 -16 0" /><path d="M4 7c0 .664 .088 1.324 .263 1.965l2.737 10.035c.5 1.5 2.239 2 5 2s4.5 -.5 5 -2c.333 -1 1.246 -4.345 2.737 -10.035a7.45 7.45 0 0 0 .263 -1.965" /></svg>
order: 300
colors:
  fill: '#EAF7F5'
  stroke: '#0B8577'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: R2 Bucket name
  - key: bucketName
    label: Bucket name
    type: text
    placeholder: uploads
  - key: locationHint
    label: Location hint
    type: select
    defaultValue: auto
    hint: A hint only; ignored when a jurisdiction is set.
    options:
      - value: auto
        label: Automatic
      - value: wnam
        label: wnam — Western North America
      - value: enam
        label: enam — Eastern North America
      - value: sam
        label: sam — South America
      - value: weur
        label: weur — Western Europe
      - value: eeur
        label: eeur — Eastern Europe
      - value: apac
        label: apac — Asia-Pacific
      - value: oc
        label: oc — Oceania
      - value: afr
        label: afr — Africa
      - value: me
        label: me — Middle East
  - key: jurisdiction
    label: Jurisdiction
    type: select
    defaultValue: none
    options:
      - value: none
        label: None
      - value: eu
        label: EU
      - value: fedramp
        label: FedRAMP
  - key: storageClass
    label: Storage class
    type: select
    defaultValue: standard
    options:
      - value: standard
        label: Standard
      - value: infrequent-access
        label: Infrequent Access
  - key: publicAccess
    label: Public access
    type: select
    defaultValue: none
    options:
      - value: none
        label: None
      - value: r2-dev
        label: r2.dev subdomain
      - value: custom-domain
        label: Custom domain
  - key: lifecycleRules
    label: Lifecycle rules
    type: list
    placeholder: delete tmp/ after 7 days
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what is stored and who reads it.
