# dai.types.cloudflare.pages-project
name: Pages Project
version: 1.0.0
description: A Cloudflare Pages project, a static or full-stack site built from a Git repository.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2l0 -10" /><path d="M6 8h.01" /><path d="M9 8h.01" /><path d="M3 11h18" /></svg>
order: 110
colors:
  fill: '#FEF3E8'
  stroke: '#F38020'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Pages Project name
  - key: projectName
    label: Project name
    type: text
    placeholder: marketing-site
  - key: productionBranch
    label: Production branch
    type: text
    placeholder: main
  - key: buildCommand
    label: Build command
    type: text
    placeholder: npm run build
  - key: outputDirectory
    label: Output directory
    type: text
    placeholder: dist
  - key: customDomains
    label: Custom domains
    type: list
    placeholder: www.example.com
  - key: bindings
    label: Bindings
    type: list
    placeholder: "KV: CACHE → kv-sessions"
    hint: Model each binding as a connection to its resource node.
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the site, its framework and preview deployments.
