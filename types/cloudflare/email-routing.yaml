# dai.types.cloudflare.email-routing
name: Email Routing
version: 1.0.0
description: Cloudflare Email Routing rules that forward or process email sent to addresses on a Zone.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" /><path d="M3 7l9 6l9 -6" /></svg>
order: 520
colors:
  fill: '#FBEFF8'
  stroke: '#B4009E'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Email Routing name
  - key: addresses
    label: Addresses
    type: list
    placeholder: support@example.com
  - key: action
    label: Action
    type: select
    defaultValue: forward
    options:
      - value: forward
        label: Forward
      - value: worker
        label: Send to Worker
      - value: drop
        label: Drop
  - key: destination
    label: Destination
    type: text
    placeholder: team@company.com or email-worker
  - key: catchAll
    label: Catch-all
    type: boolean
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe where mail goes and who handles it.
