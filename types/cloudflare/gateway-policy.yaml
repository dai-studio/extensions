# dai.types.cloudflare.gateway-policy
name: Gateway Policy
version: 1.0.0
description: A Cloudflare Gateway DNS, HTTP or network policy that filters traffic from users and devices.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" /><path d="M11 11a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" /><path d="M12 12l0 2.5" /></svg>
order: 640
colors:
  fill: '#FDF3F4'
  stroke: '#D13438'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Gateway Policy name
  - key: policyType
    label: Policy type
    type: select
    options:
      - value: dns
        label: DNS
      - value: http
        label: HTTP
      - value: network
        label: Network
  - key: action
    label: Action
    type: select
    options:
      - value: allow
        label: Allow
      - value: block
        label: Block
      - value: isolate
        label: Isolate
      - value: do-not-inspect
        label: Do not inspect
      - value: other
        label: Other
  - key: selector
    label: Selector
    type: text
    placeholder: Content categories in {Gambling}
  - key: precedence
    label: Precedence
    type: number
    min: 0
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what this policy protects against.
