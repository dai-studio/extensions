# dai.types.cloudflare.rate-limit-rule
name: Rate Limiting Rule
version: 1.0.0
description: A Cloudflare rate limiting rule that limits requests matching an expression.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a7 7 0 1 0 14 0a7 7 0 1 0 -14 0" /><path d="M12 10l0 3l2 0" /><path d="M7 4l-2.75 2" /><path d="M17 4l2.75 2" /></svg>
order: 610
colors:
  fill: '#FDF3F4'
  stroke: '#D13438'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Rate Limiting Rule name
  - key: expression
    label: Expression
    type: text
    placeholder: "http.request.uri.path eq \"/login\""
  - key: requests
    label: Requests
    type: number
    min: 1
  - key: periodSeconds
    label: Period (s)
    type: number
    min: 10
  - key: action
    label: Action
    type: select
    defaultValue: block
    options:
      - value: block
        label: Block
      - value: managed-challenge
        label: Managed challenge
      - value: js-challenge
        label: JS challenge
      - value: log
        label: Log
  - key: mitigationSeconds
    label: Mitigation timeout (s)
    type: number
    min: 0
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what abuse this rule prevents.
