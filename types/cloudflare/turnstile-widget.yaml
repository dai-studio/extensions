# dai.types.cloudflare.turnstile-widget
name: Turnstile Widget
version: 1.0.0
description: A Cloudflare Turnstile widget, a privacy-preserving CAPTCHA alternative that is verified server-side.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11.46 20.846a12 12 0 0 1 -7.96 -14.846a12 12 0 0 0 8.5 -3a12 12 0 0 0 8.5 3a12 12 0 0 1 -.09 7.06" /><path d="M15 19l2 2l4 -4" /></svg>
order: 620
colors:
  fill: '#FDF3F4'
  stroke: '#D13438'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Turnstile Widget name
  - key: siteKey
    label: Site key
    type: text
    placeholder: 0x4AAAAAAA…
  - key: mode
    label: Mode
    type: select
    defaultValue: managed
    options:
      - value: managed
        label: Managed
      - value: non-interactive
        label: Non-interactive
      - value: invisible
        label: Invisible
  - key: domains
    label: Domains
    type: list
    placeholder: example.com
  - key: siteverifyEndpoint
    label: Verified by
    type: text
    placeholder: POST /api/signup
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the forms or actions this widget protects.
