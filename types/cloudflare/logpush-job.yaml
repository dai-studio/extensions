# dai.types.cloudflare.logpush-job
name: Logpush Job
version: 1.0.0
description: A Cloudflare Logpush job that delivers a log dataset to storage or a SIEM.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" /><path d="M9 9l1 0" /><path d="M9 13l6 0" /><path d="M9 17l6 0" /></svg>
order: 700
colors:
  fill: '#F4F4F5'
  stroke: '#52525B'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Logpush Job name
  - key: dataset
    label: Dataset
    type: text
    placeholder: http_requests
  - key: destination
    label: Destination
    type: select
    options:
      - value: r2
        label: R2
      - value: s3
        label: Amazon S3
      - value: gcs
        label: Google Cloud Storage
      - value: azure-blob
        label: Azure Blob Storage
      - value: datadog
        label: Datadog
      - value: splunk
        label: Splunk
      - value: http
        label: HTTP endpoint
      - value: other
        label: Other
  - key: filter
    label: Filter
    type: text
    placeholder: EdgeResponseStatus >= 500
  - key: fields
    label: Fields
    type: list
    placeholder: ClientIP
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe who uses these logs and how long they are kept.
