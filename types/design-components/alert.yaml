# dai.types.design-components.alert
name: "Alert"
version: 1.0.0
description: "Feedback to the user: alert, toast, banner or inline message. Nest a tone to set its copy style."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4" /><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.87l-8.106 -13.536a1.914 1.914 0 0 0 -3.274 0z" /><path d="M12 16h.01" /></svg>
order: 100
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Alert name"
  - key: status
    label: "Status"
    type: select
    defaultValue: "draft"
    options:
      - value: "draft"
        label: "Draft"
      - value: "beta"
        label: "Beta"
      - value: "stable"
        label: "Stable"
      - value: "deprecated"
        label: "Deprecated"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <div class="dai-alert dai-alert--success" role="status">
        <strong>Saved.</strong> Your changes are live.
      </div>
      <div class="dai-alert dai-alert--danger" role="alert">
        <strong>Payment failed.</strong> Update your card to keep your plan.
      </div>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-alert {
        padding: var(--dai-space-3, 0.75rem) var(--dai-space-4, 1rem);
        margin-bottom: var(--dai-space-2, 0.5rem);
        border-left: 4px solid currentColor;
        border-radius: var(--dai-radius-sm, 4px);
        background: var(--dai-color-surface-alt, #f8fafc);
        font-family: var(--dai-font-sans, system-ui, sans-serif);
      }

      .dai-alert--success { color: var(--dai-color-success, #16a34a); }
      .dai-alert--danger { color: var(--dai-color-danger, #dc2626); }
      .dai-alert strong { color: var(--dai-color-text, #0f172a); }
  - key: accessibility
    label: "Accessibility"
    type: markdown
    placeholder: "Role, keyboard behaviour, ARIA attributes, focus handling and contrast requirements."
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "When to use it, when not to, and do/don't guidance."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions, links to code and design files."
