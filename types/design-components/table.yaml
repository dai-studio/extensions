# dai.types.design-components.table
name: "Table"
version: 1.0.0
description: "A data table for comparing records. Nest states (empty, loading) and actions inside it."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2" /><path d="M3 10h18" /><path d="M10 4v16" /></svg>
order: 90
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Table name"
  - key: status
    label: "Status"
    type: select
    defaultValue: "draft"
    options:
      - value: "draft"
        label: "Draft"
      - value: "beta"
        label: "Beta"
      - value: "stable"
        label: "Stable"
      - value: "deprecated"
        label: "Deprecated"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <table class="dai-table">
        <caption>Open invoices</caption>
        <thead>
          <tr><th scope="col">Customer</th><th scope="col">Due</th><th scope="col" class="num">Amount</th></tr>
        </thead>
        <tbody>
          <tr><td>Northwind</td><td>12 Nov</td><td class="num">$4,200</td></tr>
          <tr><td>Globex</td><td>18 Nov</td><td class="num">$1,350</td></tr>
        </tbody>
      </table>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-table {
        width: 100%;
        border-collapse: collapse;
        font: var(--dai-text-sm, 0.875rem) / 1.4 var(--dai-font-sans, system-ui, sans-serif);
        color: var(--dai-color-text, #0f172a);
      }

      .dai-table caption { text-align: left; font-weight: 600; padding-bottom: var(--dai-space-2, 0.5rem); }

      .dai-table th,
      .dai-table td {
        padding: var(--dai-space-2, 0.5rem) var(--dai-space-3, 0.75rem);
        border-bottom: 1px solid var(--dai-color-border, #e2e8f0);
        text-align: left;
      }

      .dai-table th { color: var(--dai-color-text-muted, #475569); font-weight: 600; }
      .dai-table .num { text-align: right; font-variant-numeric: tabular-nums; }
      .dai-table tbody tr:hover { background: var(--dai-color-surface-alt, #f8fafc); }
  - key: accessibility
    label: "Accessibility"
    type: markdown
    placeholder: "Role, keyboard behaviour, ARIA attributes, focus handling and contrast requirements."
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "When to use it, when not to, and do/don't guidance."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions, links to code and design files."
