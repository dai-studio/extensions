# dai.types.design-components.modal
name: "Modal"
version: 1.0.0
description: "A dialog that interrupts the current task for a decision or focused input. Nest its content and actions inside it."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" /><rect x="7" y="8" width="10" height="8" rx="1" /></svg>
order: 70
colors:
  fill: '#EFF6FF'
  stroke: '#2563EB'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Modal name"
  - key: status
    label: "Status"
    type: select
    defaultValue: "draft"
    options:
      - value: "draft"
        label: "Draft"
      - value: "beta"
        label: "Beta"
      - value: "stable"
        label: "Stable"
      - value: "deprecated"
        label: "Deprecated"
  - key: html
    label: "HTML"
    type: html
    rows: 10
    example: |-
      <div class="dai-backdrop">
        <div class="dai-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-desc">
          <h2 class="dai-modal__title" id="modal-title">Delete project?</h2>
          <p id="modal-desc">This permanently removes the project and its history.</p>
          <div class="dai-modal__actions">
            <button class="dai-modal__button" type="button">Cancel</button>
            <button class="dai-modal__button dai-modal__button--danger" type="button">Delete</button>
          </div>
        </div>
      </div>
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      .dai-backdrop {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgb(15 23 42 / 0.4);
        font-family: var(--dai-font-sans, system-ui, sans-serif);
      }

      .dai-modal {
        width: min(28rem, calc(100% - 2rem));
        padding: var(--dai-space-6, 1.5rem);
        border-radius: var(--dai-radius-lg, 16px);
        background: var(--dai-color-surface, #ffffff);
        color: var(--dai-color-text, #0f172a);
        box-shadow: var(--dai-shadow-lg, 0 12px 32px rgb(15 23 42 / 0.18));
      }

      .dai-modal__title { margin: 0 0 var(--dai-space-2, 0.5rem); font-size: var(--dai-text-lg, 1.25rem); }
      .dai-modal__actions { display: flex; gap: var(--dai-space-2, 0.5rem); justify-content: flex-end; margin-top: var(--dai-space-6, 1.5rem); }

      .dai-modal__button {
        font: inherit;
        padding: var(--dai-space-2, 0.5rem) var(--dai-space-4, 1rem);
        border: 1px solid var(--dai-color-border, #e2e8f0);
        border-radius: var(--dai-radius-md, 8px);
        background: var(--dai-color-surface, #ffffff);
        color: inherit;
      }

      .dai-modal__button--danger {
        border-color: transparent;
        background: var(--dai-color-danger, #dc2626);
        color: var(--dai-color-primary-contrast, #ffffff);
      }
  - key: accessibility
    label: "Accessibility"
    type: markdown
    placeholder: "Role, keyboard behaviour, ARIA attributes, focus handling and contrast requirements."
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "When to use it, when not to, and do/don't guidance."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Open questions, links to code and design files."
