# dai.types.business.partner
name: "Partner"
version: 1.0.0
description: "An outside organisation the business works with: a technology, reseller, supplier, integration or strategic partner."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 12.572l-7.5 7.428l-7.5 -7.428a5 5 0 1 1 7.5 -6.566a5 5 0 1 1 7.5 6.572" /><path d="M12 6l-3.293 3.293a1 1 0 0 0 0 1.414l.543 .543c.69 .69 1.81 .69 2.5 0l1 -1a3.182 3.182 0 0 1 4.5 0l2.25 2.25" /><path d="M12.5 15.5l2 2" /><path d="M15 13l2 2" /></svg>
colors:
  fill: '#f0fdf4'
  stroke: '#15803d'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Partner name"
  - key: partnerType
    label: "Type"
    type: select
    options:
      - value: "technology"
        label: "Technology"
      - value: "reseller"
        label: "Reseller / channel"
      - value: "supplier"
        label: "Supplier"
      - value: "integration"
        label: "Integration"
      - value: "strategic"
        label: "Strategic"
  - key: website
    label: "Website"
    type: text
    placeholder: "https://\u2026"
  - key: agreement
    label: "Agreement"
    type: text
    placeholder: "e.g. MSA, revenue share, referral"
  - key: value
    label: "Value"
    type: textarea
    placeholder: "What each side gets"
  - key: status
    label: "Status"
    type: select
    defaultValue: "prospect"
    options:
      - value: "prospect"
        label: "Prospect"
      - value: "active"
        label: "Active"
      - value: "ending"
        label: "Ending"
      - value: "ended"
        label: "Ended"
  - key: owner
    label: "Relationship owner"
    type: text
    placeholder: "Responsible person or team"
  - key: notes
    label: "Notes"
    type: textarea
