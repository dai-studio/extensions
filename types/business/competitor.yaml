# dai.types.business.competitor
name: "Competitor"
version: 1.0.0
description: "A competing company or product. Documents its positioning, strengths, weaknesses and how much of a threat it is."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3v5l-11 9l-4 4l-3 -3l4 -4l9 -11h5" /><path d="M5 13l6 6" /><path d="M14.32 17.32l3.68 3.68l3 -3l-3.365 -3.365" /><path d="M10 5.5l-2 -2.5h-5v5l3 2.5" /></svg>
colors:
  fill: '#f0fdf4'
  stroke: '#15803d'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Competitor name"
  - key: website
    label: "Website"
    type: text
    placeholder: "https://\u2026"
  - key: positioning
    label: "Positioning"
    type: textarea
    placeholder: "Who it targets and how it differentiates"
  - key: strengths
    label: "Strengths"
    type: textarea
  - key: weaknesses
    label: "Weaknesses"
    type: textarea
  - key: threat
    label: "Threat"
    type: select
    options:
      - value: "low"
        label: "Low"
      - value: "medium"
        label: "Medium"
      - value: "high"
        label: "High"
  - key: notes
    label: "Notes"
    type: textarea
