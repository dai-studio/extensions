# dai.types.business.constraint
name: "Constraint"
version: 1.0.0
description: "A fixed limit the work must fit within: a deadline, budget cap, legal or regulatory limit, technical limit or resource limit. Distinct from Requirement (what to build), Policy (an org-wide rule) and Assumption (what is believed true)."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1l0 -6" /><path d="M7 16v4" /><path d="M7.5 15l9 -7" /><path d="M13 15l6.5 -5" /><path d="M4.5 12l5.5 -4.5" /><path d="M17 16v4" /><path d="M5 20h4" /><path d="M15 20h4" /><path d="M17 7v-2" /><path d="M7 7v-2" /></svg>
colors:
  fill: '#f0fdf4'
  stroke: '#15803d'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Constraint name"
  - key: constraintType
    label: "Type"
    type: select
    options:
      - value: "time"
        label: "Time"
      - value: "budget"
        label: "Budget"
      - value: "legal"
        label: "Legal / regulatory"
      - value: "technical"
        label: "Technical"
      - value: "resource"
        label: "Resource"
      - value: "other"
        label: "Other"
  - key: limit
    label: "Limit"
    type: text
    placeholder: "e.g. Launch by 1 March; max $50k; EU data residency"
  - key: source
    label: "Source"
    type: text
    placeholder: "Who or what imposes it"
  - key: negotiable
    label: "Negotiable"
    type: boolean
    defaultValue: false
  - key: owner
    label: "Owner"
    type: text
    placeholder: "Responsible person or team"
  - key: notes
    label: "Notes"
    type: textarea
