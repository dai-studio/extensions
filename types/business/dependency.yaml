# dai.types.business.dependency
name: "Dependency"
version: 1.0.0
description: "Something the work needs from another team, vendor, decision or approval before it can proceed. Distinct from Software \u2192 Dependency (packages, services and APIs)."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15l6 -6" /><path d="M11 6l.463 -.536a5 5 0 0 1 7.071 7.072l-.534 .464" /><path d="M13 18l-.397 .534a5.068 5.068 0 0 1 -7.127 0a4.972 4.972 0 0 1 0 -7.071l.524 -.463" /></svg>
colors:
  fill: '#f0fdf4'
  stroke: '#15803d'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Dependency name"
  - key: dependencyKind
    label: "Kind"
    type: select
    options:
      - value: "team"
        label: "Team"
      - value: "vendor"
        label: "Vendor"
      - value: "decision"
        label: "Decision"
      - value: "approval"
        label: "Approval"
      - value: "data"
        label: "Data"
      - value: "other"
        label: "Other"
  - key: providedBy
    label: "Provided by"
    type: text
    placeholder: "Team, vendor or person"
  - key: needBy
    label: "Needed by"
    type: text
    placeholder: "e.g. 2026-11-15"
  - key: status
    label: "Status"
    type: select
    defaultValue: "not-started"
    options:
      - value: "not-started"
        label: "Not started"
      - value: "in-progress"
        label: "In progress"
      - value: "delivered"
        label: "Delivered"
      - value: "blocked"
        label: "Blocked"
  - key: owner
    label: "Owner"
    type: text
    placeholder: "Responsible person or team"
  - key: notes
    label: "Notes"
    type: textarea
