# dai.types.design-guidance.design-rule
name: "Design Rule"
version: 1.0.0
description: "A concrete rule agents and designers must follow, e.g. \"Use at most one primary button per view\". It applies to whatever it is nested in (at the root: the whole document)."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a1 1 0 0 1 1 1v5a1 1 0 0 1 -1 1h-7a1 1 0 0 0 -1 1v7a1 1 0 0 1 -1 1h-5a1 1 0 0 1 -1 -1v-14a1 1 0 0 1 1 -1" /><path d="M4 8l2 0" /><path d="M4 12l3 0" /><path d="M4 16l2 0" /><path d="M8 4l0 2" /><path d="M12 4l0 3" /><path d="M16 4l0 2" /></svg>
order: 30
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Rule name"
  - key: instruction
    label: "Instruction"
    type: markdown
    placeholder: "The rule, in one imperative sentence, plus any exceptions."
  - key: priority
    label: "Priority"
    type: select
    defaultValue: "should"
    hint: "RFC 2119 strength. Agents treat \"must\" as non-negotiable."
    options:
      - value: "must"
        label: "Must"
      - value: "should"
        label: "Should"
      - value: "may"
        label: "May"
  - key: rationale
    label: "Rationale"
    type: textarea
    placeholder: "Why this matters. Helps agents apply it to cases it does not spell out."
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Sources, owners and history."
