# dai.types.ai.knowledge
name: "Knowledge"
version: 1.0.0
description: "A knowledge base that AI steps retrieve from (RAG): documents, sites, wikis or databases indexed for search. Distinct from Context (inline grounding), Memory (accumulates over time) and Dataset (offline training or evaluation)."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -14" /><path d="M9 5a1 1 0 0 1 1 -1h2a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-2a1 1 0 0 1 -1 -1l0 -14" /><path d="M5 8h4" /><path d="M9 16h4" /><path d="M13.803 4.56l2.184 -.53c.562 -.135 1.133 .19 1.282 .732l3.695 13.418a1.02 1.02 0 0 1 -.634 1.219l-.133 .041l-2.184 .53c-.562 .135 -1.133 -.19 -1.282 -.732l-3.695 -13.418a1.02 1.02 0 0 1 .634 -1.219l.133 -.041" /><path d="M14 9l4 -1" /><path d="M16 16l3.923 -.98" /></svg>
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Knowledge name"
  - key: notes
    label: "Description"
    type: textarea
    placeholder: "What is this knowledge for?"
  - key: sourceType
    label: "Source"
    type: select
    options:
      - value: "documents"
        label: "Documents"
      - value: "website"
        label: "Website"
      - value: "wiki"
        label: "Wiki"
      - value: "database"
        label: "Database"
      - value: "code"
        label: "Code repository"
      - value: "api"
        label: "API"
      - value: "other"
        label: "Other"
  - key: location
    label: "Location"
    type: text
    placeholder: "URL, bucket, path or connection"
  - key: retrieval
    label: "Retrieval"
    type: select
    defaultValue: "hybrid"
    options:
      - value: "vector"
        label: "Vector"
      - value: "keyword"
        label: "Keyword"
      - value: "hybrid"
        label: "Hybrid"
      - value: "graph"
        label: "Graph"
  - key: embeddingModel
    label: "Embedding model"
    type: text
    placeholder: "e.g. text-embedding-3-large"
  - key: chunking
    label: "Chunking"
    type: text
    placeholder: "e.g. 800 tokens, 100 overlap"
  - key: refresh
    label: "Refresh"
    type: select
    options:
      - value: "static"
        label: "Static"
      - value: "scheduled"
        label: "Scheduled"
      - value: "live"
        label: "Live"
  - key: topK
    label: "Results per query (top-k)"
    type: number
    defaultValue: 5
    min: 1
