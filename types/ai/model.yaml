# dai.types.ai.model
name: "Model"
version: 1.0.0
description: "An AI/ML model that Agents and Prompts use: an LLM, embedding, vision, speech or classical ML model. Records the provider, the model ID and default parameters. Distinct from Software \u2192 Model (a data schema)."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8" /><path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8" /><path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5" /><path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0" /><path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5" /><path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10" /></svg>
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Model name"
  - key: notes
    label: "Description"
    type: textarea
    placeholder: "What is this model for?"
  - key: model
    label: "Model"
    type: model-selector
  - key: provider
    label: "Provider"
    type: select
    options:
      - value: "anthropic"
        label: "Anthropic"
      - value: "openai"
        label: "OpenAI"
      - value: "google"
        label: "Google"
      - value: "mistral"
        label: "Mistral"
      - value: "meta"
        label: "Meta"
      - value: "deepseek"
        label: "DeepSeek"
      - value: "qwen"
        label: "Qwen"
      - value: "self-hosted"
        label: "Self-hosted / open-weight"
      - value: "other"
        label: "Other"
  - key: modality
    label: "Modality"
    type: select
    defaultValue: "text"
    options:
      - value: "text"
        label: "Text"
      - value: "multimodal"
        label: "Multimodal"
      - value: "embedding"
        label: "Embedding"
      - value: "image"
        label: "Image"
      - value: "speech"
        label: "Speech"
      - value: "classical"
        label: "Classical ML"
  - key: contextWindow
    label: "Context window (tokens)"
    type: number
    min: 0
  - key: temperature
    label: "Temperature"
    type: number
    min: 0
    max: 2
    step: 0.1
  - key: maxOutputTokens
    label: "Max output tokens"
    type: number
    min: 0
  - key: endpoint
    label: "Endpoint"
    type: text
    placeholder: "API base URL or deployment name"
