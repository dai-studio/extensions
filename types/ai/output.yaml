# dai.types.ai.output
name: "Output"
version: 1.0.0
description: "A result an Agent or workflow produces: a response, document, file, structured data or action payload. Defines its format, schema and destination."
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M11.5 21h-4.5a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v5m-5 6h7m-3 -3l3 3l-3 3" /></svg>
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Output name"
  - key: notes
    label: "Description"
    type: textarea
    placeholder: "What is this output for?"
  - key: format
    label: "Format"
    type: select
    defaultValue: "text"
    options:
      - value: "text"
        label: "Text"
      - value: "markdown"
        label: "Markdown"
      - value: "json"
        label: "JSON"
      - value: "file"
        label: "File"
      - value: "image"
        label: "Image"
      - value: "audio"
        label: "Audio"
      - value: "code"
        label: "Code"
  - key: schema
    label: "Schema"
    type: code
    placeholder: "JSON Schema or example structure"
    rows: 8
  - key: destination
    label: "Destination"
    type: text
    placeholder: "e.g. user, Slack channel, S3 path, API"
  - key: sampleOutput
    label: "Example"
    type: textarea
    placeholder: "A representative output"
