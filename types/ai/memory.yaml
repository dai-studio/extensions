# dai.types.ai.memory
# Migrated from ws-dai-studio editor-src/src/lib/types/builtin/ai/memory.ts
name: Memory
version: 1.0.0
description: A persistent or long-term memory store. Distinct from Context (scoped, ephemeral grounding) — Memory persists across sessions and accumulates over time.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14h.01" /><path d="M14 14h.01" /><path d="M10 17a3.5 3.5 0 0 0 4 0" /><path d="M4 6c0 1.657 3.582 3 8 3s8 -1.343 8 -3s-3.582 -3 -8 -3s-8 1.343 -8 3" /><path d="M4 6v12c0 1.657 3.582 3 8 3s8 -1.343 8 -3v-12" /></svg>
colors:
  fill: '#F5F3FF'
  stroke: '#7C3AED'
bpmnType: bpmn:Task
stepType: memory
license: free
aliases:
  - a1b2c3d4-0002-0001-0001-000000000016
form:
  - key: name
    label: Name
    type: text
    placeholder: Memory store name
  - key: memoryType
    label: Type
    type: select
    options:
      - value: episodic
        label: Episodic — past interactions and events
      - value: semantic
        label: Semantic — facts and world knowledge
      - value: procedural
        label: Procedural — skills and how-to knowledge
  - key: scope
    label: Scope
    type: select
    options:
      - value: session
        label: Session — persists for current session
      - value: user
        label: User — persists per user across sessions
      - value: global
        label: Global — shared across all users
  - key: backend
    label: Backend
    type: text
    placeholder: e.g. vector DB, Redis, in-process
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what this memory stores and how it is retrieved.
