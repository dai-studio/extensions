# dai.types.aws.sns-topic
name: AWS SNS Topic
version: 1.0.0
description: An AWS SNS publish/subscribe topic.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 5a2 2 0 1 1 4 0a7 7 0 0 1 4 6v3a4 4 0 0 0 2 3h-16a4 4 0 0 0 2 -3v-3a7 7 0 0 1 4 -6" /><path d="M9 17v1a3 3 0 0 0 6 0v-1" /></svg>
order: 510
colors:
  fill: '#FDEFF6'
  stroke: '#E7157B'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: SNS Topic name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: topicType
    label: Topic type
    type: select
    defaultValue: standard
    options:
      - value: standard
        label: Standard
      - value: fifo
        label: FIFO
  - key: subscriptions
    label: Subscriptions
    type: list
    placeholder: "sqs:orders-queue / lambda:fn / email:ops@…"
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the publishers and the message format.
