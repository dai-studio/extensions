# dai.types.aws.route53-zone
name: AWS Route 53 Hosted Zone
version: 1.0.0
description: "An AWS Route 53 hosted zone, which holds the DNS records for a domain."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0v-1.5a9 9 0 1 0 -5.5 8.28" /></svg>
order: 270
colors:
  fill: '#F7F3FF'
  stroke: '#8C4FFF'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Route 53 Hosted Zone name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: zoneName
    label: Domain
    type: text
    placeholder: example.com
  - key: zoneVisibility
    label: Visibility
    type: select
    defaultValue: public
    options:
      - value: public
        label: Public
      - value: private
        label: Private
  - key: records
    label: Records
    type: list
    placeholder: A www → ALB alias
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Notes about this zone.
