# dai.types.aws.bedrock-model
name: Bedrock Model
version: 1.0.0
description: A foundation model invoked through AWS Bedrock.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8" /><path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8" /><path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5" /><path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0" /><path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5" /><path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10" /></svg>
order: 800
colors:
  fill: '#EDF9F7'
  stroke: '#01A88D'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Bedrock Model name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: modelId
    label: Model ID
    type: text
    placeholder: anthropic.claude-… / amazon.nova-…
  - key: invocation
    label: Invocation
    type: select
    defaultValue: on-demand
    options:
      - value: on-demand
        label: On-demand
      - value: provisioned-throughput
        label: Provisioned throughput
      - value: cross-region-inference
        label: Cross-Region inference profile
  - key: guardrail
    label: Guardrail
    type: text
    placeholder: Guardrail ID or name
  - key: knowledgeBase
    label: Knowledge base
    type: text
    placeholder: Knowledge base ID or name
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe how the model is used and any prompt or guardrail constraints.
