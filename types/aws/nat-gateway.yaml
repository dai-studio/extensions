# dai.types.aws.nat-gateway
name: AWS NAT Gateway
version: 1.0.0
description: A managed NAT gateway that lets private subnets make outbound connections. Usually placed in a public Subnet.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10h-16l5.5 -6" /><path d="M4 14h16l-5.5 6" /></svg>
order: 220
colors:
  fill: '#F7F3FF'
  stroke: '#8C4FFF'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: NAT Gateway name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: natGatewayId
    label: NAT gateway ID
    type: text
    placeholder: nat-0123456789abcdef0
  - key: connectivityType
    label: Connectivity
    type: select
    defaultValue: public
    options:
      - value: public
        label: Public
      - value: private
        label: Private
  - key: elasticIp
    label: Elastic IP
    type: text
    placeholder: eipalloc-… or address
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Notes about this NAT gateway.
