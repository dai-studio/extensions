# dai.types.aws.cloudwatch-log-group
name: AWS CloudWatch Log Group
version: 1.0.0
description: An AWS CloudWatch Logs log group.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4" /><path d="M17 21h-10a2 2 0 0 1 -2 -2v-14a2 2 0 0 1 2 -2h7l5 5v11a2 2 0 0 1 -2 2" /><path d="M9 9l1 0" /><path d="M9 13l6 0" /><path d="M9 17l6 0" /></svg>
order: 710
colors:
  fill: '#FDEFF6'
  stroke: '#E7157B'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: CloudWatch Log Group name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: logGroupName
    label: Log group name
    type: text
    placeholder: "/aws/lambda/my-function"
  - key: retentionDays
    label: Retention
    type: select
    defaultValue: "30"
    options:
      - value: "1"
        label: 1 day
      - value: "3"
        label: 3 days
      - value: "7"
        label: 1 week
      - value: "14"
        label: 2 weeks
      - value: "30"
        label: 1 month
      - value: "90"
        label: 3 months
      - value: "180"
        label: 6 months
      - value: "365"
        label: 1 year
      - value: never
        label: Never expire
  - key: kmsKey
    label: KMS key
    type: text
    placeholder: alias/logs
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the log sources and subscription filters.
