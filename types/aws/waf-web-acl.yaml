# dai.types.aws.waf-web-acl
name: WAF Web ACL
version: 1.0.0
description: "An AWS WAF web ACL that filters HTTP requests to CloudFront, an ALB or API Gateway."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a12 12 0 0 0 8.5 3a12 12 0 0 1 -8.5 15a12 12 0 0 1 -8.5 -15a12 12 0 0 0 8.5 -3" /></svg>
order: 640
colors:
  fill: '#FDF1F2'
  stroke: '#DD344C'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: WAF Web ACL name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: wafScope
    label: Scope
    type: select
    defaultValue: regional
    options:
      - value: regional
        label: Regional
      - value: cloudfront
        label: CloudFront
  - key: managedRuleGroups
    label: Managed rule groups
    type: list
    placeholder: AWSManagedRulesCommonRuleSet
  - key: rateLimit
    label: Rate limit (requests / 5 min)
    type: number
    min: 0
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the custom rules and exceptions.
