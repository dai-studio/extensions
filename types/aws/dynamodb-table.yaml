# dai.types.aws.dynamodb-table
name: DynamoDB Table
version: 1.0.0
description: An AWS DynamoDB key-value and document table.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-14" /><path d="M3 10h18" /><path d="M10 3v18" /></svg>
order: 410
colors:
  fill: '#FBF0FC'
  stroke: '#C925D1'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: DynamoDB Table name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: tableName
    label: Table name
    type: text
  - key: partitionKey
    label: Partition key
    type: text
    placeholder: pk (S)
  - key: sortKey
    label: Sort key
    type: text
    placeholder: sk (S)
  - key: billingMode
    label: Billing mode
    type: select
    defaultValue: on-demand
    options:
      - value: on-demand
        label: On-demand
      - value: provisioned
        label: Provisioned
  - key: streamView
    label: Stream
    type: select
    defaultValue: none
    options:
      - value: none
        label: Disabled
      - value: keys-only
        label: Keys only
      - value: new-image
        label: New image
      - value: old-image
        label: Old image
      - value: new-and-old-images
        label: New and old images
  - key: globalTable
    label: Global table
    type: boolean
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the access patterns and GSIs.
