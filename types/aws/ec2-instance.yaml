# dai.types.aws.ec2-instance
name: EC2 Instance
version: 1.0.0
description: A virtual server in AWS EC2. Usually placed inside a Subnet or Auto Scaling Group.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3v-2" /><path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3v2a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3l0 -2" /><path d="M7 8l0 .01" /><path d="M7 16l0 .01" /></svg>
order: 100
colors:
  fill: '#FEF5ED'
  stroke: '#ED7100'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: EC2 Instance name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: instanceType
    label: Instance type
    type: text
    placeholder: m7g.large
  - key: ami
    label: AMI
    type: text
    placeholder: ami-0123456789abcdef0
  - key: purchaseOption
    label: Purchase option
    type: select
    defaultValue: on-demand
    options:
      - value: on-demand
        label: On-Demand
      - value: spot
        label: Spot
      - value: reserved
        label: Reserved
      - value: savings-plan
        label: Savings Plan
  - key: securityGroups
    label: Security groups
    type: list
    placeholder: sg-0123456789abcdef0
    hint: Security groups attached to this resource. Model each one as an AWS Security Group node.
  - key: iamRole
    label: Instance profile / role
    type: text
    placeholder: Role name or ARN
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what runs on this instance.
