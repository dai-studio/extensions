# dai.types.aws.elasticache-cluster
name: AWS ElastiCache
version: 1.0.0
description: "An AWS ElastiCache in-memory cache (Valkey, Redis OSS or Memcached)."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" /></svg>
order: 420
colors:
  fill: '#FBF0FC'
  stroke: '#C925D1'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: ElastiCache name
  - key: arn
    label: ARN
    type: text
    placeholder: "arn:aws:…"
  - key: engine
    label: Engine
    type: select
    defaultValue: valkey
    options:
      - value: valkey
        label: Valkey
      - value: redis
        label: Redis OSS
      - value: memcached
        label: Memcached
  - key: nodeType
    label: Node type
    type: text
    placeholder: cache.r7g.large
  - key: serverless
    label: Serverless
    type: boolean
  - key: numNodes
    label: Nodes
    type: number
    min: 1
  - key: securityGroups
    label: Security groups
    type: list
    placeholder: sg-0123456789abcdef0
    hint: Security groups attached to this resource. Model each one as an AWS Security Group node.
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what is cached and the eviction policy.
