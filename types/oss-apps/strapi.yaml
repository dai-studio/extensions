# dai.types.oss-apps.strapi
name: "Strapi"
version: 1.0.0
description: "Strapi, a headless CMS written in Node.js. Place it inside an OS, container host or Kubernetes cluster. License: MIT (Community Edition)."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" /><path d="M7 15v-6l2 2l2 -2v6" /><path d="M14 13l2 2l2 -2m-2 2v-6" /></svg>
order: 150
group: cms
colors:
  fill: '#FDF4FF'
  stroke: '#C026D3'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Strapi name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: deployment
    label: "Deployment"
    type: select
    defaultValue: "container"
    options:
      - value: "package"
        label: "OS package / binary"
      - value: "container"
        label: "Container"
      - value: "kubernetes"
        label: "Kubernetes (Helm / operator)"
      - value: "managed"
        label: "Managed service"
  - key: port
    label: "Port"
    type: number
    defaultValue: 1337
    min: 0
  - key: replicas
    label: "Replicas"
    type: number
    defaultValue: 1
    min: 0
  - key: endpoint
    label: "Endpoint"
    type: text
    placeholder: "host:port or URL"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Topology, persistence, backups, scaling and who connects."
