# dai.types.design.radius
name: "Radius"
version: 1.0.0
description: "A corner radius token. Nest it in a design system for global use or in a component for local overrides."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-9a7 7 0 0 1 7 -7h9" /></svg>
order: 60
colors:
  fill: '#FFF1F2'
  stroke: '#E11D48'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Radius name"
  - key: tokenName
    label: "Token name"
    type: text
    placeholder: "e.g. --dai-radius-md"
    hint: "CSS custom property or DTCG path."
  - key: value
    label: "Value"
    type: text
    placeholder: "e.g. 8px"
  - key: usage
    label: "Usage"
    type: markdown
    placeholder: "Which surfaces use this radius."
  - key: css
    label: "CSS"
    type: css
    rows: 10
    example: |-
      :root {
        --dai-radius-sm: 4px;
        --dai-radius-md: 8px;
        --dai-radius-lg: 16px;
        --dai-radius-full: 9999px;
      }
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "Nesting rule: inner radius = outer radius − padding."
