# dai.types.oss-security.certbot
name: "Certbot"
version: 1.0.0
description: "Certbot, an ACME client that obtains and renews Let's Encrypt certificates. Connect it to the systems it builds, configures or checks. License: Apache-2.0."
icon: "▣"
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 6 0a3 3 0 1 0 -6 0" /><path d="M13 17.5v4.5l2 -1.5l2 1.5v-4.5" /><path d="M10 19h-5a2 2 0 0 1 -2 -2v-10c0 -1.1 .9 -2 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -1 1.73" /><path d="M6 9l12 0" /><path d="M6 12l3 0" /><path d="M6 15l2 0" /></svg>
order: 430
group: certificates
colors:
  fill: '#FEF2F2'
  stroke: '#DC2626'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: "Name"
    type: text
    placeholder: "Certbot name"
  - key: version
    label: "Version"
    type: text
    placeholder: "e.g. latest stable release"
  - key: configPath
    label: "Config / entry file"
    type: text
    placeholder: "/etc/letsencrypt"
  - key: tags
    label: "Tags"
    type: key-value
  - key: notes
    label: "Notes"
    type: textarea
    placeholder: "How and where it runs, and what it acts on."
