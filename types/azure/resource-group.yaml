# dai.types.azure.resource-group
name: Resource Group
version: 1.0.0
description: An Azure resource group, a logical container that shares lifecycle, access control and policy. Put it inside a Region (or directly in a Subscription); it contains Virtual Networks and resources.
icon: ▢
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l3 3h7a2 2 0 0 1 2 2v8a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2" /></svg>
order: 40
colors:
  fill: '#F3F2F1'
  stroke: '#605E5C'
bpmnType: bpmn:SubProcess
isExpanded: true
defaultWidth: 600
defaultHeight: 400
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Resource Group name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: owner
    label: Owner
    type: text
    placeholder: Team or person accountable for this resource group
  - key: environment
    label: Environment
    type: select
    options:
      - value: development
        label: Development
      - value: staging
        label: Staging
      - value: production
        label: Production
      - value: testing
        label: Testing
      - value: other
        label: Other
  - key: lock
    label: Lock
    type: select
    defaultValue: none
    options:
      - value: none
        label: None
      - value: can-not-delete
        label: CanNotDelete
      - value: read-only
        label: ReadOnly
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what belongs in this resource group and how it is deployed.
