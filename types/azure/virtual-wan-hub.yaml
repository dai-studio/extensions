# dai.types.azure.virtual-wan-hub
name: Virtual WAN Hub
version: 1.0.0
description: An Azure Virtual WAN hub that connects VNets, branches and VPN/ExpressRoute gateways.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19a2 2 0 1 0 4 0a2 2 0 0 0 -4 0" /><path d="M19 7a2 2 0 1 0 0 -4a2 2 0 0 0 0 4" /><path d="M11 19h5.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h4.5" /></svg>
order: 230
colors:
  fill: '#F1F8EA'
  stroke: '#5E9C00'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Virtual WAN Hub name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: addressPrefix
    label: Address prefix
    type: text
    placeholder: 10.100.0.0/23
  - key: connections
    label: Connections
    type: list
    placeholder: vnet-spoke-1
  - key: routingPreference
    label: Routing preference
    type: select
    defaultValue: expressroute
    options:
      - value: expressroute
        label: ExpressRoute
      - value: vpn-gateway
        label: VPN gateway
      - value: as-path
        label: AS path
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the routing, gateways and secured-hub setup.
