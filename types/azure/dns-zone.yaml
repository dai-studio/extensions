# dai.types.azure.dns-zone
name: DNS Zone
version: 1.0.0
description: An Azure DNS zone, public or private, which holds the DNS records for a domain.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" /><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0v-1.5a9 9 0 1 0 -5.5 8.28" /></svg>
order: 270
colors:
  fill: '#F1F8EA'
  stroke: '#5E9C00'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: DNS Zone name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: zoneName
    label: Zone name
    type: text
    placeholder: example.com
  - key: zoneType
    label: Zone type
    type: select
    options:
      - value: public
        label: Public
      - value: private
        label: Private
  - key: linkedVnets
    label: Linked VNets
    type: list
    placeholder: vnet-hub
    hint: Private zones only.
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the key records and who manages them.
