order: 260
colors:
  fill: '#F1F8EA'
  stroke: '#5E9C00'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Front Door name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: tier
    label: Tier
    type: select
    defaultValue: standard
    options:
      - value: standard
        label: Standard
      - value: premium
        label: Premium
  - key: endpoints
    label: Endpoints
    type: list
    placeholder: app.example.com
  - key: origins
    label: Origins
    type: list
    placeholder: app-web.azurewebsites.net
  - key: wafPolicy
    label: WAF policy
    type: text
    placeholder: waf-afd
    hint: Model it as a WAF Policy node.
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the routes, caching and origin groups.
