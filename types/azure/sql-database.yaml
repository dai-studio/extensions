# dai.types.azure.sql-database
name: SQL Database
version: 1.0.0
description: "An Azure managed relational database: Azure SQL, SQL Managed Instance, or PostgreSQL / MySQL flexible server."
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a8 3 0 1 0 16 0a8 3 0 1 0 -16 0" /><path d="M4 6v6a8 3 0 0 0 16 0v-6" /><path d="M4 12v6a8 3 0 0 0 16 0v-6" /></svg>
order: 400
colors:
  fill: '#EDF1FA'
  stroke: '#3A5BB8'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: SQL Database name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: engine
    label: Engine
    type: select
    options:
      - value: azure-sql-database
        label: Azure SQL Database
      - value: sql-managed-instance
        label: SQL Managed Instance
      - value: postgresql-flexible
        label: PostgreSQL flexible server
      - value: mysql-flexible
        label: MySQL flexible server
  - key: version
    label: Engine version
    type: text
    placeholder: "16"
  - key: skuTier
    label: SKU / tier
    type: text
    placeholder: General Purpose, 4 vCores
  - key: zoneRedundant
    label: Zone redundant
    type: boolean
  - key: storageGiB
    label: Storage (GiB)
    type: number
    min: 1
  - key: privateAccess
    label: Private access only
    type: boolean
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the schema, backups and replicas.
