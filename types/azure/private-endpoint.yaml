# dai.types.azure.private-endpoint
name: Private Endpoint
version: 1.0.0
description: An Azure Private Endpoint, giving a PaaS resource a private IP inside a Subnet.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1 -5 -5l1.5 -1.5" /><path d="M17 12l-5 -5l1.5 -1.5a3.536 3.536 0 1 1 5 5l-1.5 1.5" /><path d="M3 21l2.5 -2.5" /><path d="M18.5 5.5l2.5 -2.5" /><path d="M10 11l-2 2" /><path d="M13 14l-2 2" /></svg>
order: 240
colors:
  fill: '#F1F8EA'
  stroke: '#5E9C00'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Private Endpoint name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: targetResource
    label: Target resource
    type: text
    placeholder: Storage account, SQL server, Key Vault…
  - key: subResource
    label: Sub-resource
    type: text
    placeholder: blob
  - key: privateDnsZone
    label: Private DNS zone
    type: text
    placeholder: privatelink.blob.core.windows.net
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe which clients use this endpoint.
