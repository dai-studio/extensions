# dai.types.azure.api-management
name: API Management
version: 1.0.0
description: An Azure API Management instance that publishes, secures and meters APIs.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h5" /><path d="M12 16v-8h3a2 2 0 0 1 2 2v1a2 2 0 0 1 -2 2h-3" /><path d="M20 8v8" /><path d="M9 16v-5.5a2.5 2.5 0 0 0 -5 0v5.5" /></svg>
order: 280
colors:
  fill: '#F1F8EA'
  stroke: '#5E9C00'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: API Management name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: tier
    label: Tier
    type: select
    options:
      - value: consumption
        label: Consumption
      - value: developer
        label: Developer
      - value: basic
        label: Basic
      - value: standard
        label: Standard
      - value: premium
        label: Premium
      - value: basic-v2
        label: Basic v2
      - value: standard-v2
        label: Standard v2
      - value: premium-v2
        label: Premium v2
  - key: gatewayUrl
    label: Gateway URL
    type: text
    placeholder: https://contoso.azure-api.net
  - key: apis
    label: APIs
    type: list
    placeholder: orders-api
  - key: vnetMode
    label: VNet mode
    type: select
    defaultValue: none
    options:
      - value: none
        label: None
      - value: external
        label: External
      - value: internal
        label: Internal
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the APIs, policies and products.
