# dai.types.azure.public-ip
name: Public IP Address
version: 1.0.0
description: An Azure public IP address for inbound or outbound internet connectivity.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19.5 7a9 9 0 0 0 -7.5 -4a8.991 8.991 0 0 0 -7.484 4" /><path d="M11.5 3a16.989 16.989 0 0 0 -1.826 4" /><path d="M12.5 3a16.989 16.989 0 0 1 1.828 4" /><path d="M19.5 17a9 9 0 0 1 -7.5 4a8.991 8.991 0 0 1 -7.484 -4" /><path d="M11.5 21a16.989 16.989 0 0 1 -1.826 -4" /><path d="M12.5 21a16.989 16.989 0 0 0 1.828 -4" /><path d="M2 10l1 4l1.5 -4l1.5 4l1 -4" /><path d="M17 10l1 4l1.5 -4l1.5 4l1 -4" /><path d="M9.5 10l1 4l1.5 -4l1.5 4l1 -4" /></svg>
order: 210
colors:
  fill: '#F1F8EA'
  stroke: '#5E9C00'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Public IP Address name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: ipAddress
    label: IP address
    type: text
    placeholder: "20.0.0.1"
  - key: sku
    label: SKU
    type: select
    defaultValue: standard
    options:
      - value: standard
        label: Standard
      - value: standard-global
        label: Standard (global)
  - key: allocation
    label: Allocation
    type: select
    defaultValue: static
    options:
      - value: static
        label: Static
      - value: dynamic
        label: Dynamic
  - key: dnsLabel
    label: DNS label
    type: text
    placeholder: myapp
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe what this address is attached to.
