# dai.types.azure.foundry-model
name: Foundry Model
version: 1.0.0
description: A model deployment in Microsoft Foundry (formerly Azure AI Foundry), including Azure OpenAI models.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 13a3.5 3.5 0 0 0 -3.5 3.5v1a3.5 3.5 0 0 0 7 0v-1.8" /><path d="M8.5 13a3.5 3.5 0 0 1 3.5 3.5v1a3.5 3.5 0 0 1 -7 0v-1.8" /><path d="M17.5 16a3.5 3.5 0 0 0 0 -7h-.5" /><path d="M19 9.3v-2.8a3.5 3.5 0 0 0 -7 0" /><path d="M6.5 16a3.5 3.5 0 0 1 0 -7h.5" /><path d="M5 9.3v-2.8a3.5 3.5 0 0 1 7 0v10" /></svg>
order: 800
colors:
  fill: '#EEF7F4'
  stroke: '#107C6B'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Foundry Model name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: model
    label: Model
    type: text
    placeholder: gpt-4.1
  - key: deploymentName
    label: Deployment name
    type: text
    placeholder: chat-prod
  - key: deploymentType
    label: Deployment type
    type: select
    options:
      - value: global-standard
        label: Global Standard
      - value: data-zone-standard
        label: Data Zone Standard
      - value: standard
        label: Standard
      - value: global-provisioned
        label: Global Provisioned
      - value: provisioned
        label: Provisioned
      - value: batch
        label: Global Batch
  - key: capacity
    label: Capacity
    type: number
    min: 1
    hint: TPM in thousands, or PTUs for provisioned deployments.
  - key: endpoint
    label: Endpoint
    type: text
    placeholder: https://contoso.openai.azure.com/
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the prompts, content filters and callers.
