# dai.types.azure.key-vault
name: Key Vault
version: 1.0.0
description: An Azure Key Vault that stores secrets, keys and certificates.
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v6a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -6" /><path d="M8 11v-4a4 4 0 1 1 8 0v4" /><path d="M15 16h.01" /><path d="M12.01 16h.01" /><path d="M9.02 16h.01" /></svg>
order: 620
colors:
  fill: '#FDF3F4'
  stroke: '#D13438'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Key Vault name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: vaultUri
    label: Vault URI
    type: text
    placeholder: https://kv-contoso.vault.azure.net/
  - key: sku
    label: SKU
    type: select
    defaultValue: standard
    options:
      - value: standard
        label: Standard
      - value: premium
        label: Premium (HSM-backed keys)
  - key: permissionModel
    label: Permission model
    type: select
    defaultValue: rbac
    options:
      - value: rbac
        label: Azure RBAC
      - value: access-policy
        label: Access policies
  - key: purgeProtection
    label: Purge protection
    type: boolean
  - key: secrets
    label: Secrets
    type: list
    placeholder: db-connection-string
  - key: keys
    label: Keys
    type: list
    placeholder: cmk-storage
  - key: certificates
    label: Certificates
    type: list
    placeholder: app-example-com
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe who reads from this vault and how items are rotated.
