# dai.types.azure.event-hub
name: Event Hub
version: 1.0.0
description: An Azure Event Hub for high-throughput event streaming (Kafka compatible).
icon: ▣
quickicon: <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12h-2c-.894 0 -1.662 -.857 -1.761 -2c-.296 -3.45 -.749 -6 -2.749 -6s-2.5 3.582 -2.5 8s-.5 8 -2.5 8s-2.452 -2.547 -2.749 -6c-.1 -1.147 -.867 -2 -1.763 -2h-2" /></svg>
order: 530
colors:
  fill: '#FBEFF8'
  stroke: '#B4009E'
bpmnType: bpmn:Task
license: free
form:
  - key: name
    label: Name
    type: text
    placeholder: Event Hub name
  - key: resourceId
    label: Resource ID
    type: text
    placeholder: /subscriptions/…/resourceGroups/…/providers/…
  - key: namespace
    label: Namespace
    type: text
    placeholder: evh-contoso
  - key: tier
    label: Tier
    type: select
    options:
      - value: basic
        label: Basic
      - value: standard
        label: Standard
      - value: premium
        label: Premium
      - value: dedicated
        label: Dedicated
  - key: partitionCount
    label: Partitions
    type: number
    defaultValue: 4
    min: 1
  - key: retentionDays
    label: Retention (days)
    type: number
    defaultValue: 1
    min: 1
    max: 90
  - key: consumerGroups
    label: Consumer groups
    type: list
    placeholder: analytics
  - key: captureEnabled
    label: Capture enabled
    type: boolean
  - key: tags
    label: Tags
    type: key-value
  - key: notes
    label: Notes
    type: textarea
    placeholder: Describe the producers, consumers and event format.
